---
debug: false

controller:
  client:
    url: http://127.0.0.1:8080
    security:
      bearer_token: placeholder
  ui:
    enabled: true
  # PKI enrollment and job signing. Always on. The suite admits its own
  # agent: integration_test.go sets the key directories in the
  # environment.
  pki:
    auto_admit: true
  api:
    port: 8080
    # Longer than the default 30s: a refresh of the package index on a CI
    # runner can take more, and the next write then waits behind it (#1271).
    job_timeout: 2m
    security:
      signing_keys:
        - id: integration
          key: 1dcf49fb9ad538f8b70fdb4ccb73c78692022e3191dba86f63308f0c3ee0e3c3
      cors:
        allow_origins: []
  nats:
    host: localhost
    port: 4222
    client_name: osapi-api-integration
    namespace: ""
    auth:
      type: none
  metrics:
    enabled: false
  notifications:
    enabled: false

nats:
  server:
    host: localhost
    port: 4222
    store_dir: .nats/jetstream/
    namespace: ""
    auth:
      type: none

  stream:
    name: JOBS
    subjects: jobs.>
    max_age: 24h
    max_msgs: 10000
    storage: memory
    replicas: 1
    discard: old

  kv:
    bucket: job-queue
    ttl: 1h
    max_bytes: 104857600
    storage: memory
    replicas: 1

  audit:
    stream: AUDIT
    subject: audit
    max_age: 720h
    max_bytes: 52428800
    storage: memory
    replicas: 1

  registry:
    bucket: agent-registry
    ttl: 30s
    storage: memory
    replicas: 1

  facts:
    bucket: agent-facts
    ttl: 5m
    storage: memory
    replicas: 1

  state:
    bucket: agent-state
    storage: memory
    replicas: 1

  objects:
    bucket: file-objects
    max_bytes: 104857600
    storage: memory
    replicas: 1
    max_chunk_size: 262144

  file_state:
    bucket: file-state
    storage: memory
    replicas: 1

  dlq:
    max_age: 168h # 7 days
    max_msgs: 1000
    storage: memory
    replicas: 1

agent:
  nats:
    host: localhost
    port: 4222
    client_name: osapi-agent-integration
    namespace: ""
    auth:
      type: none
  consumer:
    name: jobs-agent
    max_deliver: 5
    ack_wait: 2m
    max_ack_pending: 1000
    replay_policy: instant
    back_off:
      - 30s
      - 2m
      - 5m
      - 15m
      - 30m
    inactive_threshold: 24h
  queue_group: job-agents
  hostname: ""
  max_jobs: 10
  metrics:
    enabled: false
  privilege_escalation:
    enabled: false
  # Command exec, command shell and docker exec. On here, for development and tests. The default is off.
  command:
    enabled: true
  # PKI enrollment and job verification. Always on: the agent asks to join
  # at its first start, and takes jobs once the controller admits it. The
  # key directory is not the controller's, because the agent keeps the
  # controller's public key as controller.pub in it.
  # pki:
  #   key_dir: /etc/osapi/pki/agent

