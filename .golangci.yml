# golangci-lint v2 configuration.
# https://golangci-lint.run/docs/configuration/file/
#
# One config, byte for byte identical in every Go repository in osapi-io and
# in @retr0h/golang-starter, which new projects are generated from. A
# repository that needs a change to it changes it in the template too, and
# the change goes back out to the others in the same pass. `md5 .golangci.yml`
# in each repository is how you check.
#
# `version` is the string "2" and settings nest under `linters`. Written the
# v1 way — a numeric version, a top-level `linters-settings`, an
# `issues.exclude-use-default` — `run` drops the keys without complaint and
# nothing takes effect. `golangci-lint config verify` is the check.

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - errname
    - govet
    - ineffassign
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unused

  settings:
    revive:
      # Each rule is named rather than the whole set switched on. Every
      # one here states a convention Go itself has an opinion about.
      # Rules that report a threshold are left out: the number is
      # somebody's taste, not the language's.
      rules:
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unused-parameter
        - name: var-naming

  exclusions:
    paths:
      # Go source vendored inside a JavaScript dependency tree is not ours
      # to fix, and is not even tracked in git: `flatted` ships a Go port
      # beside its JS, and it only exists after npm install.
      - node_modules
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Without these every run stops at 50 findings per linter and the
  # repository looks like it has exactly 50 problems, forever.
  max-issues-per-linter: 0
  max-same-issues: 0
  # Default true, which reports one finding per line. Several rules anchor
  # to the same function declaration, so one line can carry more than one
  # and you are shown whichever came first.
  uniq-by-line: false
