# golangci-lint v2 configuration.
# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m
  # The integration tests build only with this tag. Without it, the lint
  # does not read test/integration.
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - errname
    - govet
    - ineffassign
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - unused

  settings:
    revive:
      # Named rules, not the whole set: these are conventions Go itself
      # has an opinion about. Rules that report a threshold are left out.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

  exclusions:
    paths:
      # Go shipped inside a JS package. Not ours, and not tracked in git.
      - node_modules
    # The comments preset is not here: it hid revive's checks of doc
    # comments, so a license header was the package doc of 65 files.
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  exclusions:
    paths:
      # Go shipped inside a JS package. Not ours, and not tracked in git.
      - node_modules

issues:
  # Defaults truncate: 50 findings per linter, and one per line.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
