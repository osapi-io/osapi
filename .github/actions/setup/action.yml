---
name: Set up osapi
description: >-
  Go, Node.js, Bun and just, the shared justfiles, the Go and UI dependencies,
  and the built UI, which the Go code embeds. Each job of the Go workflow
  starts with it.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Fetch justfiles
      shell: bash
      run: just fetch
    - name: Deps
      shell: bash
      run: |
        just go-deps
        just react-deps
        just react-build
