---
name: Go Integration

# The suite runs on each push to main, and on a pull request only with the
# label integration (or by hand): it grows with each behavior, and the lab
# runs it against real hosts. A break shows on main one merge later.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]
    paths:
      # Only run when something that can change the result changes. Docs-only
      # pull requests do not need the Go matrix, and the lint, markdown and
      # justfile workflows still run on them. No status check here is required
      # by branch protection, so a skipped run does not block a merge.
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yml'
      - '.coverignore'
      - 'justfile'
      - '.mise.toml'
      - 'ui/**'
      - '**/gen/api.yaml'
      - 'internal/controller/api/**/*.yaml'
      - 'cfg.yaml'
      - '.github/workflows/go-int.yml'

permissions:
  contents: read


# A new push to a pull request cancels its run in progress, so a stale run
# holds no runner. A push to main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      # The integration tests do not read the UI, and the Go workflow builds
      # and lints it. The embed needs only a file in ui/dist.
      - name: Deps
        run: |
          just go-deps
          mkdir -p ui/dist && touch ui/dist/.keep
      # As root, with each write test on, as the lab runs them: the runner is
      # thrown away after the job, so they may change its kernel parameters,
      # /etc and its hostname.
      # The suite prepares the runner through osapi, as it prepares a lab VM
      # (test/integration/prepare_test.go), so the job has no host setup.
      - name: Integration
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" OSAPI_INTEGRATION_WRITES=1 OSAPI_INTEGRATION_WRITE_BEHAVIORS=1 just go-unit-int
