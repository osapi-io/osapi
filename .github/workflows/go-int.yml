---
name: Go Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      # Only run when something that can change the result changes. Docs-only
      # pull requests do not need the Go matrix, and the lint, markdown and
      # justfile workflows still run on them. No status check here is required
      # by branch protection, so a skipped run does not block a merge.
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yml'
      - '.coverignore'
      - 'justfile'
      - '.mise.toml'
      - 'ui/**'
      - '**/gen/api.yaml'
      - 'internal/controller/api/**/*.yaml'
      - 'cfg.yaml'
      - '.github/workflows/go-int.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      - name: Deps
        run: |
          just go-deps
          just react-deps
      - name: Lint UI
        run: just react-lint
      - name: Build UI
        run: just react-build
      - name: Linux tuning
        run: just linux-tune
      - name: Integration
        run: just go-unit-int
