---
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Fetch justfiles
        run: just fetch
      - name: Deps
        run: |
          just go::deps
          just go::mod
          just react-deps
      - name: Test
        run: just test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          # Name the profile explicitly. `just test` filters it through
          # .coverignore; auto-discovery could pick up an unfiltered one and
          # report a different number for the same commit.
          files: .coverage/cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
