---
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      # Only run when something that can change the result changes. Docs-only
      # pull requests do not need the Go matrix, and the lint, markdown and
      # justfile workflows still run on them. No status check here is required
      # by branch protection, so a skipped run does not block a merge.
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yml'
      - '.coverignore'
      - 'justfile'
      - '.mise.toml'
      - 'ui/**'
      - '**/gen/api.yaml'
      - 'internal/controller/api/**/*.yaml'
      - 'cfg.yaml'
      - '.github/workflows/go.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      - name: Deps
        run: |
          just go-deps
          just react-deps
      - name: Test
        run: just test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Name the profile explicitly. `just test` filters it through
          # .coverignore; auto-discovery could pick up an unfiltered one and
          # report a different number for the same commit.
          files: .coverage/cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
