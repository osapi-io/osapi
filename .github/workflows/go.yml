---
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      # Only run when something that can change the result changes. Docs-only
      # pull requests do not need the Go matrix, and the lint, markdown and
      # justfile workflows still run on them. No status check here is required
      # by branch protection, so a skipped run does not block a merge.
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yml'
      - '.coverignore'
      - 'justfile'
      - '.mise.toml'
      - 'ui/**'
      - '**/gen/api.yaml'
      - 'internal/controller/api/**/*.yaml'
      - 'cfg.yaml'
      - '.github/workflows/go.yml'
      - '.github/actions/setup/**'

permissions:
  contents: read

# The same jobs in each Go repository of osapi-io. `just go-ci-checks` and
# `just go-unit-plan` decide the jobs, from the lists that `just test` runs,
# so a laptop and CI run the same checks. .github/actions/setup has the setup
# of this repository.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      - name: Plan the jobs
        id: plan
        # Each recipe runs on a line of its own, so that its failure fails the
        # step. Inside `echo "$(...)"`, a failure leaves an empty matrix.
        # go-vet runs in the lint job, and the generation checks in the
        # generated job, which both start with the plan; the check jobs run
        # the rest.
        run: |
          checks=$(just go-ci-checks | jq -c '.check -= ["go-vet","behavior-gen-check","go-generate-check","docs-gen-check","cli-docs-gen-check","sdk-gen-check"]')
          units=$(just go-unit-plan)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "units=$units" >> "$GITHUB_OUTPUT"

  # golangci-lint is the longest check, so it starts at once, with no wait
  # for the plan, and does not queue behind the other jobs for a runner.
  # golangci-lint is the longest check, so it starts at once, with no wait
  # for the plan. It runs the prebuilt release of the version that go.mod
  # pins: through go tool, a cold runner compiled golangci-lint itself first,
  # which took most of the job.
  lint:
    runs-on: ubuntu-latest
    name: go-vet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: The version of golangci-lint in go.mod
        id: lint
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >> "$GITHUB_OUTPUT"
      # The embed needs a file in ui/dist.
      - run: mkdir -p ui/dist && touch ui/dist/.keep
      - name: go-vet
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint.outputs.version }}
          args: --config .golangci.yml

  # Each generation check regenerated the whole tree and compared it, on a
  # runner of its own. This job generates once and fails on any change.
  generated:
    runs-on: ubuntu-latest
    name: generated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          ui: "true"
      - name: Generate
        run: just generate && just cli-docs-generate
      - name: Fail on a change
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "generated files are stale: run just generate and just cli-docs-generate, and commit them" >&2
            exit 1
          fi

  check:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          # Only the job of the UI checks installs the UI packages.
          ui: ${{ contains(matrix.check, 'react') && 'true' || 'false' }}
      - name: ${{ matrix.check }}
        run: for check in ${{ matrix.check }}; do just "$check"; done

  unit:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.units) }}
    name: unit ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          js: "false"
      - name: Unit tests, shard ${{ matrix.shard }}
        run: just go-unit-shard ${{ matrix.shard }} "${{ matrix.packages }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-${{ matrix.shard }}
          path: .coverage/shard-${{ matrix.shard }}.out
          retention-days: 1

  coverage:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: .coverage
          merge-multiple: true
      - name: Join the shards and check the coverage target
        run: just go-cover-merge
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Name the profile explicitly. go-cover-merge filters it through
          # .coverignore; auto-discovery could pick up a shard's unfiltered
          # one and report a different number for the same commit.
          files: .coverage/cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
