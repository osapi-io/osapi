---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore

  # The modules under examples/sdk/ have their own go.mod and pin this
  # repository's dependencies as indirect. Without them here, Dependabot bumps
  # the root alone and `just go-mod-check` fails on every one for being untidy.
  - package-ecosystem: "gomod"
    directories:
      - "examples/sdk/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore

  # The documentation site and the UI lock their npm packages with bun. Without
  # an entry here nothing bumps them and none of them raises an alert.
  - package-ecosystem: "bun"
    directories:
      - "/docs"
      - "/ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
