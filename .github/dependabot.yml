---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # The modules under examples/sdk/ have their own go.mod and replace this
  # repository with a relative path, so a dependency the root moves, moves in
  # each of them too. Listed with the root and grouped by dependency name, one
  # pull request bumps every module at once and leaves them all tidy. As two
  # entries, the root was bumped alone and `just go-mod-check` failed on the
  # examples.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/examples/sdk/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      go-modules:
        group-by: dependency-name
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # The documentation site and the UI lock their npm packages with bun. Without
  # an entry here nothing bumps them and none of them raises an alert.
  - package-ecosystem: "bun"
    directories:
      - "/docs"
      - "/ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    # react and react-dom must be the same version. Bumped apart, the docs
    # build fails and the UI throws "Incompatible React versions" at runtime.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    commit-message:
      prefix: chore

  # The base image is pinned by digest. Dependabot proposes a new digest when
  # the tag moves, so the image cannot change between builds unreviewed.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
