# Code generated by internal/controller/endpoint/gen. DO NOT EDIT.
components:
  schemas:
    Component:
      enum:
        - controller
        - nats
        - agent
      type: string
    CryptoAlgorithm:
      properties:
        algorithm:
          description: The algorithm, with its key size or curve.
          example: ECDH P-256, HKDF-SHA256, AES-256-GCM
          type: string
        approved:
          description: Whether FIPS 140-3 approves the algorithm.
          type: boolean
        name:
          description: What the process uses it for.
          example: secrets sealed to agents
          type: string
        only_mode:
          description: Whether it works in FIPS 140-3 only mode. An approved algorithm can still fail there, when its code calls the module in a way that the mode refuses.
          type: boolean
        reason:
          description: Why it is not approved, or why it fails in FIPS 140-3 only mode.
          type: string
      required:
        - name
        - algorithm
        - approved
        - only_mode
      type: object
    CryptoListener:
      properties:
        approved:
          description: 'Whether the listener negotiates only approved versions, suites and groups: true in FIPS 140-3 mode, where crypto/tls restricts them.'
          type: boolean
        groups:
          description: 'The key exchange groups that the listener can negotiate: the configured ones, or those of crypto/tls for the process''s mode.'
          items:
            type: string
          type: array
        min_version:
          description: The lowest TLS version that the listener accepts.
          example: TLS 1.2
          type: string
        name:
          description: The listener, such as api, nats or metrics.
          example: api
          type: string
        suites:
          description: 'The cipher suites that the listener can negotiate: the configured ones, or those of crypto/tls for the process''s mode.'
          items:
            type: string
          type: array
        tls:
          description: Whether the listener serves TLS. A listener with no TLS has no other fields.
          type: boolean
      required:
        - name
        - tls
        - approved
      type: object
    ErrorResponse:
      properties:
        details:
          description: Additional details about the error.
          example: Failed due to network timeout.
          type: string
        error:
          description: A description of the error that occurred.
          example: Failed to retrieve status.
          type: string
        reason:
          description: 'Why the request failed, as a word that a program can branch on. The HTTP status is the class of the problem; the reason is the cause, and the error is the message for a person, which can change between releases. invalid_request: the request breaks a rule, such as a missing field (400). unauthorized: no token, or a token that is not valid (401). forbidden: the token does not have the permission (403). not_found: the host or osapi does not have what the request names (404). not_managed: the item is there, but osapi did not deploy it, so osapi does not change it (409). not_installed: the host does not have a program that the request needs (409). conflict: the state of the item blocks the request, such as a create of one that exists (409). unavailable: a part that osapi depends on is down, such as NATS (503). server_error: the controller failed; its log has the cause (500).'
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - not_managed
            - not_installed
            - conflict
            - unavailable
            - server_error
          example: not_found
          type: string
      type: object
    Expiry:
      enum:
        - ok
        - soon
        - expired
        - unknown
      type: string
    PKICert:
      properties:
        component:
          description: 'The component that serves it: controller, nats or agent.'
          example: agent
          type: string
        days_left:
          description: The days that are left until it expires.
          type: integer
        expires:
          description: When the certificate expires.
          format: date-time
          type: string
        file:
          description: The certificate's file on the host.
          type: string
        fingerprint:
          description: The SHA-256 fingerprint of the certificate.
          type: string
        fips_approved:
          description: Whether FIPS 186-5 and SP 800-131A approve the key and the signature algorithms.
          type: boolean
        hostname:
          description: The host that serves the certificate.
          example: web-01
          type: string
        issuer:
          description: The issuer of the certificate, as a distinguished name. The subject again for a self-signed one.
          type: string
        key:
          description: The algorithm and size of the public key, such as ECDSA P-256.
          type: string
        name:
          description: The name of the certificate, such as api or agent-metrics.
          example: agent-metrics
          type: string
        names:
          description: The DNS names and the IP addresses that the certificate is for.
          items:
            type: string
          type: array
        not_before:
          description: When the certificate starts to be valid.
          format: date-time
          type: string
        signature:
          description: The algorithm that signed the certificate, such as ECDSA-SHA256.
          type: string
        source:
          description: self-signed, which osapi made, or cert_file, the operator's.
          example: self-signed
          type: string
        state:
          description: ok; not made, when the component has not started on the host; or unreadable, with the reason.
          example: ok
          type: string
        subject:
          description: The subject of the certificate, as a distinguished name.
          type: string
      required:
        - hostname
        - name
        - state
        - component
        - source
        - file
      type: object
    PKICertList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PKICert'
          type: array
        total_items:
          description: The number of certificates.
          type: integer
      required:
        - items
        - total_items
      type: object
    PKIKeyRotation:
      properties:
        agents:
          description: 'The admitted agents that the switch waits for: each one that reported within the grace period.'
          items:
            $ref: '#/components/schemas/PKIKeyRotationAgent'
          type: array
        current:
          description: The fingerprint of the key that the controller signs jobs with.
          example: SHA256:1f53dea6
          type: string
        next:
          description: The fingerprint of the key that the controller switches to. Empty when no rotation is in progress.
          example: SHA256:9c2e41b0
          type: string
        started_at:
          description: When the rotation started.
          format: date-time
          type: string
        switch_by:
          description: 'When the controller switches at the latest: the start and controller.pki.rotation_grace_period. It switches before, once each agent has the next key.'
          format: date-time
          type: string
      required:
        - current
      type: object
    PKIKeyRotationAgent:
      properties:
        has_next:
          description: Whether the agent reports that it has the next key.
          type: boolean
        hostname:
          description: The hostname of the agent.
          example: web-01
          type: string
        machine_id:
          description: The machine ID of the agent.
          example: d530664edc1c431eb5ef1e9dfd6617a5
          type: string
      required:
        - hostname
        - machine_id
        - has_next
      type: object
    PKINATSCertRotation:
      properties:
        agents:
          description: 'The admitted agents that the switch waits for: each one that reported within the grace period.'
          items:
            $ref: '#/components/schemas/PKINATSCertRotationAgent'
          type: array
        current:
          description: The fingerprint of the certificate that the NATS server serves.
          example: SHA256:4b7d20e1
          type: string
        next:
          description: The fingerprint of the certificate that the server switches to. Empty when no rotation is in progress.
          example: SHA256:a83f61c2
          type: string
        started_at:
          description: When the rotation started.
          format: date-time
          type: string
        switch_by:
          description: 'When the server switches at the latest: the start and controller.pki.rotation_grace_period. It switches before, once each agent trusts the next certificate.'
          format: date-time
          type: string
      required:
        - current
      type: object
    PKINATSCertRotationAgent:
      properties:
        has_next:
          description: Whether the agent reports that it trusts the next certificate.
          type: boolean
        hostname:
          description: The hostname of the agent.
          example: web-01
          type: string
        machine_id:
          description: The machine ID of the agent.
          example: d530664edc1c431eb5ef1e9dfd6617a5
          type: string
      required:
        - hostname
        - machine_id
        - has_next
      type: object
    PKITLSCert:
      properties:
        days_left:
          description: The days that are left until it expires.
          type: integer
        expires:
          description: When the certificate expires.
          format: date-time
          type: string
        expiry:
          $ref: '#/components/schemas/Expiry'
        fips_approved:
          description: Whether FIPS 186-5 and SP 800-131A approve the key and the signature algorithms.
          type: boolean
        issuer:
          description: The issuer of the certificate. The subject again for a self-signed one.
          example: CN=osapi-controller
          type: string
        key:
          description: The algorithm and size of the public key, such as ECDSA P-256.
          example: ECDSA P-256
          type: string
        name:
          description: The name of the certificate, such as api or agent-metrics.
          example: api
          type: string
        names:
          description: 'The DNS names and the IP addresses that the certificate is for: its subject alternative names.'
          items:
            type: string
          type: array
        not_before:
          description: When the certificate starts to be valid.
          format: date-time
          type: string
        source:
          description: self-signed, which osapi made, or cert_file, the operator's.
          example: self-signed
          type: string
        state:
          description: ok; not made, when the component has not started on the host; or unreadable, with the reason.
          example: ok
          type: string
        subject:
          description: The subject of the certificate, as a distinguished name.
          example: CN=osapi-controller
          type: string
      required:
        - name
        - state
        - source
        - expiry
      type: object
    PKITLSList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PKITLSSection'
          type: array
        total_items:
          description: The number of components.
          type: integer
      required:
        - items
        - total_items
      type: object
    PKITLSSection:
      properties:
        algorithms:
          description: Each algorithm that the component uses, with whether FIPS 140-3 approves it.
          items:
            $ref: '#/components/schemas/CryptoAlgorithm'
          type: array
        certificates:
          description: Each certificate that the component serves, from the certificates of pki cert list.
          items:
            $ref: '#/components/schemas/PKITLSCert'
          type: array
        component:
          $ref: '#/components/schemas/Component'
        expiry:
          $ref: '#/components/schemas/Expiry'
        fips:
          description: The FIPS 140-3 mode, then what is not approved, by kind, or approved.
          example: "off"
          type: string
        go:
          description: The Go version that built the component.
          example: go1.27.3
          type: string
        hostname:
          description: The host of the component.
          example: osapi-controller
          type: string
        listeners:
          description: Each TLS listener of the component, with its lowest TLS version, its suites and its groups, and whether FIPS 140-3 approves them.
          items:
            $ref: '#/components/schemas/CryptoListener'
          type: array
        module:
          description: The version of the Go Cryptographic Module in the component.
          example: v1.0.0
          type: string
        reasons:
          description: Each reason that the component is not in FIPS 140-3 mode with only approved algorithms, as a sentence with what closes it, or with the issue that tracks it.
          items:
            type: string
          type: array
        summary:
          description: 'The section in one line, for a table: the FIPS 140-3 verdict, then the days left of the certificate that expires first.'
          example: FIPS off · cert 62d
          type: string
      required:
        - component
        - hostname
        - summary
        - fips
        - expiry
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: PKI API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/pki/cert:
    get:
      description: Lists the certificates of the controller's host, the API's, the controller's metrics and the NATS server's, and the certificates that each agent reports in its registration, with their expiry. A certificate that a host has not made is not made.
      operationId: ListPKICerts
      parameters:
        - description: 'Only the certificates of this host: the controller''s hostname, or an agent''s.'
          in: query
          name: hostname
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=255
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKICertList'
          description: The certificates of each host.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:read
      summary: List the certificates of the fleet
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: List the certificates of the fleet
          input: {}
        - doc: List the certificates of the fleet, with --hostname web-01
          input:
            hostname: web-01
      x-osapi-method: list
  /api/pki/cert/{name}:
    get:
      description: 'Reads one certificate of one host: the controller''s host when the hostname is empty, or the agent of the hostname.'
      operationId: GetPKICert
      parameters:
        - description: The name of the certificate, such as api or agent-metrics.
          in: path
          name: name
          required: true
          schema:
            maxLength: 64
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=64
        - description: The host of the certificate. Empty is the controller's host, which has the certificates of the controller.
          in: query
          name: hostname
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=255
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKICert'
          description: The certificate.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no certificate with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:read
      summary: Get one certificate of a host
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Get one certificate of a host
          input:
            name: api
        - doc: Get one certificate of a host, with --name agent-metrics --hostname web-01
          input:
            hostname: web-01
            name: agent-metrics
      x-osapi-method: get
  /api/pki/key:
    get:
      description: Shows the key that the controller signs jobs with, and during a rotation the key that it switches to, when it switches at the latest, and each admitted agent that the switch waits for, with whether it has the next key.
      operationId: GetPKIKeyRotation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKIKeyRotation'
          description: The rotation of the controller's key.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:read
      summary: Show the rotation of the controller's key
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Show the rotation of the controller's key
          input: {}
      x-osapi-method: rotation
    post:
      description: Starts the rotation of the controller's key, with no new admission of the agents. The controller makes the next key, and signs a record that gives it to the agents with its current key. Each agent takes it at its next heartbeat. The controller switches to the next key when each admitted agent that reported within controller.pki.rotation_grace_period has it, or when the grace period ends. An agent that does not have it then needs a new admission. A rotation in progress is not started again.
      operationId: RotatePKIKey
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKIKeyRotation'
          description: The rotation that started, or the one in progress.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:write
      summary: Rotate the controller's key
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Rotate the controller's key
          input: {}
      x-osapi-method: rotate
  /api/pki/nats:
    get:
      description: Shows the certificate that the NATS server serves, and during a rotation the certificate that it switches to, when it switches at the latest, and each admitted agent that the switch waits for, with whether it trusts the next certificate.
      operationId: GetPKINATSCertRotation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKINATSCertRotation'
          description: The rotation of the NATS server's certificate.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:read
      summary: Show the rotation of the NATS server's certificate
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Show the rotation of the NATS server's certificate
          input: {}
      x-osapi-method: natscertrotation
    post:
      description: Starts the rotation of the NATS server's self-signed certificate, which each joined agent pins, with no restart and no new join. The controller makes the next certificate beside the current one, and signs a record that gives both to the agents. Each agent trusts the next one at its next heartbeat. The controller renames it into place when each admitted agent that reported within controller.pki.rotation_grace_period trusts it, or when the grace period ends, and NATS serves it at its next handshake. A rotation in progress is not started again. It runs on the controller's host, which must hold the NATS server's certificate, and refuses a certificate of the operator's cert_file.
      operationId: RotatePKINATSCert
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKINATSCertRotation'
          description: The rotation that started, or the one in progress.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The NATS server serves a certificate of the operator''s cert_file: replace that file.'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:write
      summary: Rotate the NATS server's certificate
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Rotate the NATS server's certificate
          input: {}
      x-osapi-method: natscertrotate
  /api/pki/tls:
    get:
      description: 'Lists the TLS section of the controller, of the NATS server and of each agent: the FIPS 140-3 mode, with each reason that the component is not approved as a sentence; each certificate that it serves, from pki cert list, with its subject, its issuer, its validity and the days that are left; each TLS listener, with its lowest version, its suites and its groups, and whether FIPS 140-3 approves them; and the Go version, the module and the algorithms of its crypto. A certificate within 30 days of its end is soon, and one past its end is expired.'
      operationId: ListPKITLS
      parameters:
        - description: 'Only the components of this host: the controller''s hostname, or an agent''s.'
          in: query
          name: hostname
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=255
        - description: 'Only this component: controller, nats or agent.'
          in: query
          name: component
          schema:
            $ref: '#/components/schemas/Component'
          x-oapi-codegen-extra-tags:
            validate: omitempty,enum
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKITLSList'
          description: The TLS section of each component.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:read
      summary: List the TLS of each component
      tags:
        - pki_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: List the TLS of each component
          input:
            component: nats
        - doc: List the TLS of each component, with --hostname web-01
          input:
            hostname: web-01
        - doc: 'List the TLS of each component, with '
          input: {}
      x-osapi-method: tls
  /api/pki/tls/{component}:
    get:
      description: 'Reads the TLS section of one component of one host in full: the controller or the NATS server of the controller''s host when the hostname is empty, or the agent of the hostname. It has the reasons, each certificate, each listener and each algorithm.'
      operationId: GetPKITLS
      parameters:
        - description: 'The component: controller, nats or agent.'
          in: path
          name: component
          required: true
          schema:
            $ref: '#/components/schemas/Component'
          x-oapi-codegen-extra-tags:
            validate: required,enum
        - description: The host of the component. Empty is the controller's host, which an agent's section must name.
          in: query
          name: hostname
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=255
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PKITLSSection'
          description: The TLS section of the component.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no such component.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - pki:read
      summary: Get the TLS of one component
      tags:
        - pki_operations
      x-osapi-area: fleet
