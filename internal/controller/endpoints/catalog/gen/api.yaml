info:
  title: Catalog API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/catalog:
    get:
      description: Returns each behavior with its methods, the areas, the permissions, the built-in roles, the permission of each operation, the tones of the statuses and the counts, and the host families. The UI reads it after sign-in. Each built-in role has catalog:read.
      operationId: GetCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
          description: The catalog.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - catalog:read
      summary: Get the catalog
      tags:
        - catalog
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Get the catalog
          input: {}
      x-osapi-method: get
tags:
  - description: The behaviors, the permissions and the roles that the controller serves, for the UI.
    name: catalog
    x-displayName: Catalog
    x-osapi-area: fleet
    x-osapi-group: catalog
