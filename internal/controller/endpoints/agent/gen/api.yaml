  /api/agent/join:
    post:
      description: 'An agent calls it one time, at its first start, over HTTPS, after it checks the controller''s certificate against the fingerprint of its join string. A token that admits admits the machine at once, as admit does, and the admission record names the token. The request is signed with the agent''s signing key, which shows that it holds the key that it asks the controller to admit. It needs no bearer token: the join token authorizes it.'
      operationId: JoinAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
          description: The machine is admitted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The encryption key is not a public P-256 key. An agent with an older key makes a new one and joins again.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not signed by the key that it asks to admit.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: This controller takes no join.
      security: []
      summary: Join an agent with a join token
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-method: join
      x-osapi-program: true
