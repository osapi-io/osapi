info:
  title: Agent Management API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/agent:
    get:
      description: Discover all active agents in the fleet.
      operationId: GetAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: List of active agents.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: List active agents
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: List active agents
          input: {}
      x-osapi-method: list
  /api/agent/{hostname}:
    get:
      description: Get detailed information about a specific agent by hostname.
      operationId: GetAgentDetails
      parameters:
        - description: The hostname of the agent to retrieve.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInfo'
          description: Agent details.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: Get agent details
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Get agent details
          input:
            hostname: web-01
      x-osapi-method: get
  /api/agent/{hostname}/drain:
    post:
      description: Stop the agent from accepting new jobs. In-flight jobs continue to completion.
      operationId: DrainAgent
      parameters:
        - description: The hostname of the agent to drain.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "204":
          description: Agent drain initiated.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent already in requested state.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:write
      summary: Drain an agent
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Drain an agent
          input:
            hostname: web-01
      x-osapi-method: drain
  /api/agent/{hostname}/undrain:
    post:
      description: Resume accepting jobs on a drained agent.
      operationId: UndrainAgent
      parameters:
        - description: The hostname of the agent to undrain.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "204":
          description: Agent undrain initiated.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not in draining or cordoned state.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:write
      summary: Undrain an agent
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Undrain an agent
          input:
            hostname: web-01
      x-osapi-method: undrain
  /api/agent/config/{hostname}:
    get:
      description: Returns the config that the controller holds for the agent, with its version.
      operationId: GetAgentConfig
      parameters:
        - description: The hostname of the agent.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
          description: The config of the agent.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: Read the config of an agent
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Read the config of an agent
          input:
            hostname: web-01
      x-osapi-method: getconfig
    put:
      description: 'Sets the labels, the max jobs, the log level and the facts interval of the agent as the next version of its config. The agent applies them at once: it takes the jobs of the new labels, runs at most max jobs at the same time, logs at the level, collects its facts at the interval, and no restart is necessary.'
      operationId: PutAgentConfig
      parameters:
        - description: The hostname of the agent.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
