info:
  title: Agent Management API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/agent:
    get:
      description: Discover all active agents in the fleet.
      operationId: GetAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: List of active agents.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: List active agents
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: List active agents
          input: {}
      x-osapi-method: list
  /api/agent/{hostname}:
    get:
      description: Get detailed information about a specific agent by hostname.
      operationId: GetAgentDetails
      parameters:
        - description: The hostname of the agent to retrieve.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInfo'
          description: Agent details.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: Get agent details
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Get agent details
          input:
            hostname: web-01
      x-osapi-method: get
  /api/agent/{hostname}/drain:
    post:
      description: Stop the agent from accepting new jobs. In-flight jobs continue to completion.
      operationId: DrainAgent
      parameters:
        - description: The hostname of the agent to drain.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "204":
          description: Agent drain initiated.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent already in requested state.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:write
      summary: Drain an agent
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Drain an agent
          input:
            hostname: web-01
      x-osapi-method: drain
  /api/agent/{hostname}/undrain:
    post:
      description: Resume accepting jobs on a drained agent.
      operationId: UndrainAgent
      parameters:
        - description: The hostname of the agent to undrain.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        "204":
          description: Agent undrain initiated.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not in draining or cordoned state.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:write
      summary: Undrain an agent
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Undrain an agent
          input:
            hostname: web-01
      x-osapi-method: undrain
  /api/agent/facts:
    get:
      description: 'Returns the fact keys that an input can refer to as @fact.<key>: the built-in keys and the custom keys that agents register.'
      operationId: GetAgentFacts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactKeysResponse'
          description: The fact keys.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: List the fact keys
      tags:
        - agent_operations
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: List the fact keys
          input: {}
      x-osapi-method: facts
tags:
  - description: Operations related to agent discovery and details.
    name: agent_operations
    x-displayName: Agent
    x-osapi-area: fleet
    x-osapi-group: agent
