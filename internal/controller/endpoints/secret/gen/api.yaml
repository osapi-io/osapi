info:
  title: Secret Management API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/secret:
    get:
      description: List each vault of controller.secrets.vaults, with its type, its targets and whether it answers.
      operationId: GetSecretVaults
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultListResponse'
          description: The vaults of the controller.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - secret:read
      summary: List the vaults
      tags:
        - secret_operations
      x-osapi-area: secrets
      x-osapi-examples:
        - doc: List the vaults
          input: {}
      x-osapi-method: vaults
  /api/secret/{vault}:
    get:
      description: 'List the metadata of each key of a vault: its version, when it changed and who changed it. The list has no value.'
      operationId: GetSecrets
      parameters:
        - description: The name of the vault, such as default.
          in: path
          name: vault
          required: true
          schema:
            example: default
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretListResponse'
          description: The keys of the vault.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The controller has no vault with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - secret:read
      summary: List the keys of a vault
      tags:
        - secret_operations
      x-osapi-area: secrets
      x-osapi-examples:
        - doc: List the keys of a vault
          input:
            vault: default
      x-osapi-method: list
  /api/secret/{vault}/{key}:
    delete:
      description: Delete a key from its vault. A request that uses its reference after that fails.
      operationId: DeleteSecret
      parameters:
        - description: The name of the vault, such as default.
          in: path
          name: vault
          required: true
          schema:
            example: default
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=64
        - description: The name of the key, such as registry-token.
          in: path
          name: key
          required: true
          schema:
            example: registry-token
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=128
      responses:
        "204":
          description: The key is deleted.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The vault has no key with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - secret:write
      summary: Delete a key
      tags:
        - secret_operations
      x-osapi-area: secrets
      x-osapi-examples:
        - doc: Delete a key
          input:
            key: registry-token
            vault: default
      x-osapi-method: delete
    get:
      description: Get the version of a key, when it changed and who changed it. The answer has no value.
      operationId: GetSecret
      parameters:
        - description: The name of the vault, such as default.
          in: path
          name: vault
          required: true
          schema:
            example: default
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=64
        - description: The name of the key, such as registry-token.
          in: path
          name: key
          required: true
          schema:
            example: registry-token
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=128
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretInfo'
          description: The metadata of the key.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The vault has no key with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - secret:read
      summary: Get the metadata of a key
      tags:
        - secret_operations
      x-osapi-area: secrets
      x-osapi-examples:
        - doc: Get the metadata of a key
          input:
            key: registry-token
            vault: default
      x-osapi-method: get
    put:
      description: Write a value as the next version of a key, or as version 1 of a new key. The answer is the metadata of the key. The API never gives the value back.
      operationId: PutSecret
      parameters:
        - description: The name of the vault, such as default.
          in: path
          name: vault
          required: true
          schema:
            example: default
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=64
        - description: The name of the key, such as registry-token.
          in: path
          name: key
          required: true
          schema:
            example: registry-token
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=128
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretInfo'
          description: The metadata of the key after the write.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The controller has no vault with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - secret:write
      summary: Write the value of a key
      tags:
        - secret_operations
      x-osapi-area: secrets
      x-osapi-examples:
        - doc: Read the value from standard input
          input:
            key: registry-token
            value: '-'
            vault: default
      x-osapi-method: update
  /api/secret/{vault}/{key}/value:
    get:
      description: Get the value of a key, for a tool that needs the value itself. It is the one method that gives a value, and it needs secret:reveal, which only the admin role has. The audit log records each call, with the vault, the key and the caller, and never the value.
      operationId: GetSecretValue
      parameters:
        - description: The name of the vault, such as default.
          in: path
          name: vault
          required: true
          schema:
            example: default
            maxLength: 64
