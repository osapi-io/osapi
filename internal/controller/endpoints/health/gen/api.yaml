info:
  title: Health Check API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/health:
    get:
      description: Returns 200 if the process is alive. No checks performed.
      operationId: GetHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Process is alive.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security: []
      summary: Liveness probe
      tags:
        - health
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Liveness probe
          input: {}
      x-osapi-method: liveness
  /api/health/ready:
    get:
      description: Returns 200 when the service is ready to accept traffic.
      operationId: GetHealthReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Service is ready.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Service is not ready.
      security: []
      summary: Readiness probe
      tags:
        - health
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Readiness probe
          input: {}
      x-osapi-method: ready
  /api/health/status:
    get:
      description: Returns per-component health status with system metrics. Requires authentication.
      operationId: GetHealthStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: The status of each component. A component that is not healthy makes the overall status degraded; the request still succeeds.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - health:read
      summary: System status and component health
      tags:
        - health
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: System status and component health
          input: {}
      x-osapi-method: status
tags:
  - description: Health check endpoints for liveness, readiness, and detailed status.
    name: health
    x-displayName: Health
