paths:
  /api/job:
    get:
      description: Retrieve jobs, optionally filtered by status.
      operationId: GetJobs
      parameters:
        - description: Filter jobs by status.
          in: query
          name: status
          schema:
            enum:
              - submitted
              - processing
              - completed
              - failed
              - partial_failure
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,oneof=submitted processing completed failed partial_failure
        - description: Maximum number of jobs per page (1-100).
          in: query
          name: limit
          schema:
            default: 10
            maximum: 100
            minimum: 1
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=100
        - description: Number of jobs to skip for pagination.
          in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobsResponse'
          description: A list of jobs.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - job:read
      summary: List jobs
      tags:
        - job_operations
  /api/job/{id}:
    delete:
      description: Delete a specific job by its ID.
      operationId: DeleteJobByID
      parameters:
        - description: UUID of the job to delete.
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
          x-oapi-codegen-extra-tags:
            validate: uuid
      responses:
