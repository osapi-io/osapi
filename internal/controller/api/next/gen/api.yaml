      operationId: GetNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - description: Only this parameter and the ones under it, such as net.ipv4
          in: query
          name: prefix
          schema:
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
            type: string
