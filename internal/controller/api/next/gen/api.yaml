          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: ../../common/gen/api.yaml#/components/schemas/ErrorResponse
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: ../../common/gen/api.yaml#/components/schemas/ErrorResponse
          description: The job could not be run or its result could not be read.
      security:
        - BearerAuth:
            - sysctl:read
      summary: List the kernel's parameters and which osapi manages
      tags:
        - sysctl_operations
    post:
      description: 'Writes osapi-<key>.conf to behaviors.sysctl.dir, /etc/sysctl.d by default, and applies it with sysctl -p. Running it again with the same value changes nothing and reports changed: false.'
      operationId: PostNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysctlCreateRequest'
        description: Input to sysctl create.
