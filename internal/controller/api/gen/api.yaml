openapi: 3.0.0
info:
  title: osapi
  description: |
    Typed, repeatable operations for Linux hosts. Give your agent a fleet, not
    a shell.

    osapi lets an AI agent manage Linux hosts through typed operations, not
    through a login. Each operation is a behavior: one thing on a host,
    defined one time, with a fixed input and output. osapi checks each
    request before it queues it. A second run changes nothing. Each change is
    recorded.
  version: 1.0.0
  contact:
    url: https://github.com/osapi-io/osapi
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
tags:
  - description: Admit, reject and revoke the nodes that ask to join.
    name: Admission_API_admission
    x-displayName: Admission
  - description: Operations related to agent discovery and details.
    name: Agent_Management_API_agent_operations
    x-displayName: Agent
  - description: Audit log endpoints for viewing API activity.
    name: Audit_Log_API_audit
    x-displayName: Audit
  - description: The controller of the fleet.
    name: Controller_API_controller
    x-displayName: Controller
  - description: Fact key discovery for @fact. references.
    name: Facts_API_facts
    x-displayName: Facts
  - description: Object Store file management operations.
    name: File_Management_API_file_operations
    x-displayName: File
  - description: Health check endpoints for liveness, readiness, and detailed status.
    name: Health_Check_API_health
    x-displayName: Health
  - description: Operations related to the job queue.
    name: Job_Management_API_job_operations
    x-displayName: Job
  - description: The NATS server of the fleet.
    name: NATS_API_nats
    x-displayName: NATS
  - description: Telemetry endpoints, such as the spans of a trace.
    name: Telemetry_API_telemetry
    x-displayName: Telemetry
  - description: The certificate authorities that the host trusts
    name: Certificate_API_certificate_operations
    x-displayName: Node/Certificate
  - description: Run a command on target hosts
    name: Command_API_command_operations
    x-displayName: Node/Command
  - description: The Docker containers of the host
    name: Docker_API_container_docker_operations
    x-displayName: Node/Docker
  - description: The Docker images of the host
    name: Image_API_container_image_operations
    x-displayName: Node/Image
  - description: Get the disk usage of target hosts
    name: Disk_API_disk_operations
    x-displayName: Node/Disk
  - description: Files of the object store, deployed to the host
    name: File_API_file_operations
    x-displayName: Node/File
  - description: The groups of the host
    name: Group_API_group_operations
    x-displayName: Node/Group
  - description: Get or set the hostname of target hosts
    name: Hostname_API_hostname_operations
    x-displayName: Node/Hostname
  - description: Get the load averages of target hosts
    name: Load_API_load_operations
    x-displayName: Node/Load
  - description: The entries of the systemd journal
    name: Entry_API_log_entry_operations
    x-displayName: Node/Entry
  - description: The sources that write to the systemd journal
    name: Source_API_log_source_operations
    x-displayName: Node/Source
  - description: Get the memory usage of target hosts
    name: Memory_API_memory_operations
    x-displayName: Node/Memory
  - description: Whether the host reaches an address, by ICMP ping
    name: Connectivity_API_network_connectivity_operations
    x-displayName: Node/Connectivity
  - description: The DNS resolvers of each interface of the host
    name: Dns_API_network_dns_operations
    x-displayName: Node/Dns
  - description: The network interfaces of the host
    name: Interface_API_network_interface_operations
    x-displayName: Node/Interface
  - description: The routes of an interface
    name: Route_API_route_operations
    x-displayName: Node/Route
  - description: The NTP servers of chrony, and its sync status
    name: Ntp_API_ntp_operations
    x-displayName: Node/Ntp
  - description: Get the operating system of target hosts
    name: Os_API_os_operations
    x-displayName: Node/Os
  - description: The packages installed on the host
    name: Package_API_package_operations
    x-displayName: Node/Package
  - description: Reboot or shut down the host
    name: Power_API_power_operations
    x-displayName: Node/Power
  - description: The processes of the host
    name: Process_API_process_operations
    x-displayName: Node/Process
  - description: The cron entries that osapi deploys
    name: Schedule_API_schedule_operations
    x-displayName: Node/Schedule
  - description: The systemd services of the host
    name: Service_API_service_operations
    x-displayName: Node/Service
  - description: The authorized SSH keys of a user
    name: Sshkey_API_sshkey_operations
    x-displayName: Node/Sshkey
  - description: The status summary of a node
    name: Status_API_status_operations
    x-displayName: Node/Status
  - description: Kernel parameters, written to sysctl.d files and applied
    name: Sysctl_API_sysctl_operations
    x-displayName: Node/Sysctl
  - description: The timezone of the host
    name: Timezone_API_timezone_operations
    x-displayName: Node/Timezone
  - description: The updates the package index has for the host
    name: Updatepackages_API_updatepackages_operations
    x-displayName: Node/Updatepackages
  - description: Get the uptime of target hosts
    name: Uptime_API_uptime_operations
    x-displayName: Node/Uptime
  - description: The users of the host
    name: User_API_user_operations
    x-displayName: Node/User
paths:
  /api/admission:
    servers: []
    get:
      description: >-
        Returns each machine's admission record: pending, admitted, rejected or
        revoked, with whether it is online and when it was last seen.
      operationId: GetAdmissions
      parameters:
        - description: >-
            Only the records in this state: pending, admitted, rejected or
            revoked.
          in: query
          name: state
          schema:
            enum:
              - pending
              - admitted
              - rejected
              - revoked
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,oneof=pending admitted rejected revoked
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdmissionResponse'
          description: The admission records.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Admission is not configured: set controller.pki.enabled.'
      security:
        - BearerAuth:
            - admission:read
      summary: List admission records
      tags:
        - Admission_API_admission
  /api/admission/{machine_id}:
    servers: []
    delete:
      description: >-
        Removes a machine's key and each record of it, and keeps none. A machine
        that asks again is new. Use it for a machine that goes away on purpose,
        such as a VM that is rebuilt; revoke a machine that is not trusted.
      operationId: DeleteMachine
      parameters:
        - description: The machine ID of the node.
          in: path
          name: machine_id
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        '204':
          description: The machine is deleted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No record of the machine.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Admission is not configured: set controller.pki.enabled.'
      security:
        - BearerAuth:
            - admission:write
      summary: Delete a machine
      tags:
        - Admission_API_admission
    get:
      description: Returns one machine's admission record by machine ID.
      operationId: GetAdmission
      parameters:
        - description: The machine ID of the node.
          in: path
          name: machine_id
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admission'
          description: The admission record.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No admission record for the machine.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Admission is not configured: set controller.pki.enabled.'
      security:
        - BearerAuth:
            - admission:read
      summary: Get a machine's admission record
      tags:
        - Admission_API_admission
  /api/admission/{machine_id}/admit:
    servers: []
    post:
      description: >-
        Admits a pending machine. The fingerprint must be the one that `osapi
        agent admission get` prints on the machine: it proves that the request
        came from the machine the operator is looking at.
      operationId: AdmitMachine
      parameters:
        - description: The machine ID of the node.
          in: path
          name: machine_id
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmitRequest'
        required: true
      responses:
        '204':
          description: The machine is admitted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No pending request from the machine.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The fingerprint does not match the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Admission is not configured: set controller.pki.enabled.'
      security:
        - BearerAuth:
            - admission:write
      summary: Admit a pending machine
      tags:
        - Admission_API_admission
  /api/admission/{machine_id}/reject:
    servers: []
    post:
      description: >-
        Rejects a pending machine, and keeps a record of the decision, so a
        machine that asks again is flagged.
      operationId: RejectMachine
      parameters:
        - description: The machine ID of the node.
          in: path
          name: machine_id
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
        required: true
      responses:
        '204':
          description: The machine is rejected.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No pending request from the machine.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Admission is not configured: set controller.pki.enabled.'
      security:
        - BearerAuth:
            - admission:write
      summary: Reject a pending machine
      tags:
        - Admission_API_admission
  /api/admission/{machine_id}/revoke:
    servers: []
    post:
      description: >-
        Removes an admitted machine's key, and keeps a record of the decision.
        Nothing the machine signs verifies afterwards; to return, it asks again.
      operationId: RevokeMachine
      parameters:
        - description: The machine ID of the node.
          in: path
          name: machine_id
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        '204':
          description: The machine is revoked.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No admitted machine with the ID.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Admission is not configured: set controller.pki.enabled.'
      security:
        - BearerAuth:
            - admission:write
      summary: Revoke an admitted machine
      tags:
        - Admission_API_admission
  /api/agent:
    servers: []
    get:
      description: Discover all active agents in the fleet.
      operationId: GetAgents
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: List of active agents.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: List active agents
      tags:
        - Agent_Management_API_agent_operations
  /api/agent/{hostname}:
    servers: []
    get:
      description: Get detailed information about a specific agent by hostname.
      operationId: GetAgentDetails
      parameters:
        - description: The hostname of the agent to retrieve.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInfo'
          description: Agent details.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:read
      summary: Get agent details
      tags:
        - Agent_Management_API_agent_operations
  /api/agent/{hostname}/drain:
    servers: []
    post:
      description: >-
        Stop the agent from accepting new jobs. In-flight jobs continue to
        completion.
      operationId: DrainAgent
      parameters:
        - description: The hostname of the agent to drain.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        '204':
          description: Agent drain initiated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent already in requested state.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:write
      summary: Drain an agent
      tags:
        - Agent_Management_API_agent_operations
  /api/agent/{hostname}/undrain:
    servers: []
    post:
      description: Resume accepting jobs on a drained agent.
      operationId: UndrainAgent
      parameters:
        - description: The hostname of the agent to undrain.
          in: path
          name: hostname
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=255
      responses:
        '204':
          description: Agent undrain initiated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not in draining or cordoned state.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - agent:write
      summary: Undrain an agent
      tags:
        - Agent_Management_API_agent_operations
  /api/agent/status:
    servers: []
    get:
      description: >-
        Each agent, with each of its sub-components, from the health status of
        the controller.
      operationId: GetAgentStatus
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentList'
          description: Each agent component, with its sub-components.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - health:read
      summary: Show the health of each agent
      tags:
        - Agent_Management_API_agent_operations
  /api/audit:
    servers: []
    get:
      description: Returns a paginated list of audit log entries, newest first.
      operationId: GetAuditLogs
      parameters:
        - description: Maximum number of entries to return.
          in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=100
        - description: Number of entries to skip.
          in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=0
        - description: 'Only the requests that change something: each method but GET.'
          in: query
          name: writes
          schema:
            type: boolean
          x-oapi-codegen-extra-tags:
            validate: omitempty
        - description: Only the entries of this user, the subject of the token.
          in: query
          name: user
          schema:
            maxLength: 256
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,max=256
        - description: >-
            Only the entries whose operation ID or path has this text, such as
            hostname.
          in: query
          name: operation
          schema:
            maxLength: 256
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,max=256
        - description: Only the entries with this response status, such as 403.
          in: query
          name: status
          schema:
            maximum: 599
            minimum: 100
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=100,max=599
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditResponse'
          description: List of audit entries.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The audit log is not configured on the controller.
      security:
        - BearerAuth:
            - audit:read
      summary: List audit log entries
      tags:
        - Audit_Log_API_audit
  /api/audit/{id}:
    servers: []
    get:
      description: Returns a single audit log entry by ID.
      operationId: GetAuditLogByID
      parameters:
        - description: The audit entry ID.
          in: path
          name: id
