          type: string
        previous_fingerprint:
          description: >-
            On a pending record, the fingerprint of the earlier record; a
            different one is a new key.
          type: string
        reason:
          description: Why the node was rejected.
          type: string
        requested_at:
          description: When the node asked to join.
          format: date-time
          type: string
