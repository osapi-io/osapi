      name: name
      in: path
      required: true
      description: |
        Network interface name (e.g., eth0, ens33).
      x-oapi-codegen-extra-tags:
        validate: required,min=1
      schema:
        type: string
        minLength: 1
    RouteInterfaceName:
      name: interfaceName
      in: path
      required: true
      description: |
        Network interface name for route operations (e.g., eth0, ens33).
      x-oapi-codegen-extra-tags:
        validate: required,min=1
      schema:
        type: string
        minLength: 1
    PackageName:
      name: name
      in: path
      required: true
      description: >
        Package name. It starts with a letter or digit, and may have an
        architecture or a version, such as nginx:amd64 or nginx=1.24.0-1.
      x-oapi-codegen-extra-tags:
        validate: required,package_name
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9.+_:~=-]*$
    Pid:
