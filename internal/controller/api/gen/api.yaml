  /api/node/{hostname}/disk:
    servers: []
    get:
      description: >-
        Reads the size, the used space and the free space of each local
        filesystem, in bytes: the mounts of /proc/mounts on Linux and of mount
        on macOS, with their sizes from df. Local is ext4, xfs and btrfs on
        Linux, and apfs and hfs on macOS. Network and special filesystems are
        left out.
      operationId: GetNodeDisk
      parameters:
        - $ref: '#/components/parameters/Hostname'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskGetResponse'
          description: Each target host's result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            The host does not have what the request names, such as the object of
            a deploy.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            osapi did not deploy the item, so it does not change it, or the host
            does not have a program that the method needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - disk:read
      summary: Get the disk usage of the host
      tags:
        - Disk_API_disk_operations
