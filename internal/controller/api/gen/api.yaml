    TraceNode:
      properties:
        children:
          description: The spans under this one, in start order.
          items:
            $ref: '#/components/schemas/TraceNode'
          type: array
        detail:
          description: >-
            What the span acted on, as key=value pairs, led by error= on a
            failed span.
          type: string
        duration:
          description: How long the span took, as a Go duration.
          type: string
        name:
          description: The name of the span, such as job.process.
          type: string
        'on':
          description: >-
            What ran the span: the role of its service, such as controller,
            agent or cli.
          type: string
        span:
          $ref: '#/components/schemas/TraceSpan'
        status:
          description: >-
            The job's status on a job.process, changed or unchanged on a
            behavior write, and ok or error on other spans.
          type: string
      required:
        - name
        - 'on'
        - duration
        - status
        - span
      type: object
    TraceResponse:
      properties:
        duration:
          description: >-
            From the start of the first span to the end of the last, as a Go
            duration.
          type: string
        failed_spans:
          description: The number of spans that failed.
          type: integer
        nats_calls:
          description: >-
            The number of NATS calls left out, the bookkeeping of the job queue.
            all shows them.
          type: integer
        nats_time:
          description: The time that the NATS calls left out took, as a Go duration.
          type: string
        services:
          description: The services that made the spans, in the order each first appears.
          items:
            type: string
          type: array
        spans:
          description: >-
            The spans that have no parent in the trace, each with its children,
            in start order.
          items:
            $ref: '#/components/schemas/TraceNode'
          type: array
        started:
          description: When the first span started.
          format: date-time
          type: string
        trace_id:
          description: The trace ID.
          type: string
      required:
        - trace_id
        - spans
      type: object
    TraceSpan:
      properties:
        attributes:
          additionalProperties:
            type: string
          description: The attributes of the span, each as text.
          type: object
        duration_ms:
          description: How long the span took, in milliseconds.
          format: double
          type: number
        kind:
          description: The span kind, such as server, client, producer or consumer.
          type: string
        name:
          description: The name of the span, such as job.process.
          type: string
        parent_span_id:
          description: The ID of the parent span. Empty for the root.
          type: string
        service:
          description: The service that made the span, such as osapi-agent.
          type: string
        span_id:
          description: The span ID.
          type: string
        start_time:
          description: When the span started.
          format: date-time
          type: string
        status:
          description: Whether the work of the span failed.
          enum:
            - ok
            - error
          type: string
          x-oapi-codegen-extra-tags:
            validate: oneof=ok error
        status_message:
          description: The error of a failed span.
          type: string
      required:
        - span_id
        - name
        - service
        - start_time
        - duration_ms
        - status
        - attributes
      type: object
