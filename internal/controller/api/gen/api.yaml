            minimum: 1
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=10000
        - description: Only the entries since this time, in any form that journalctl --since takes, such as 1 hour ago
          in: query
          name: since
          schema:
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty
        - description: Only the entries at this priority or above
