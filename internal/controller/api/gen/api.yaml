          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The file is an osapi file, which a caller cannot write.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            The file exists with different content. Replace it with PUT
