          in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=0
        - description: 'Only the requests that change something: each method but GET.'
          in: query
          name: writes
          schema:
            type: boolean
          x-oapi-codegen-extra-tags:
            validate: omitempty
        - description: Only the entries of this user, the subject of the token.
          in: query
          name: user
          schema:
            maxLength: 256
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,max=256
        - description: Only the entries whose operation ID or path has this text, such as hostname.
          in: query
          name: operation
          schema:
            maxLength: 256
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,max=256
        - description: Only the entries with this response status, such as 403.
          in: query
          name: status
