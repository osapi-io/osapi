      description: Get the value of a key, for a tool that needs the value itself. It is the one method that gives a value, and it needs secret:reveal, which only the admin role has. The audit log records each call, with the vault, the key and the caller, and never the value.
      operationId: GetSecretValue
      parameters:
        - description: The name of the vault, such as default.
          in: path
          name: vault
          required: true
          schema:
            example: default
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=64
        - description: The name of the key, such as registry-token.
          in: path
          name: key
          required: true
          schema:
            example: registry-token
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required,resource_name,max=128
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretValue'
          description: The value of the key.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The vault has no key with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - secret:reveal
      summary: Reveal the value of a key
      tags:
        - Secret_Management_API_secret_operations
      x-osapi-area: secrets
      x-osapi-examples:
        - doc: Reveal the value of a key
          input:
            key: registry-token
            vault: default
      x-osapi-method: reveal
  /api/telemetry/trace/{id}:
    get:
      description: Returns each span of a trace, read from the tracing backend at telemetry.tracing.url. The backend gets the spans a few seconds after the request, so a trace of a request that just ran can be not found yet. A token with a target scope gets a trace only when each target that the trace records is in its scope.
      operationId: GetTrace
      parameters:
        - description: The trace ID, which a command prints after its job ID, 32 hexadecimal characters
          in: path
          name: id
          required: true
          schema:
            pattern: ^[0-9a-f]{32}$
            type: string
          x-oapi-codegen-extra-tags:
            validate: required
        - description: Show the NATS calls too, the reads and writes of the job queue
          in: query
          name: all
          schema:
            type: boolean
          x-oapi-codegen-extra-tags:
            validate: omitempty
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
          description: The spans of the trace.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The backend has no trace with this ID, or not yet, or a target of the trace is outside the token's target scope.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No tracing backend is configured on the controller.
      security:
        - BearerAuth:
            - trace:read
      summary: Get the spans of a trace
      tags:
        - Telemetry_API_telemetry
      x-osapi-area: fleet
      x-osapi-examples:
        - doc: Get the spans of a trace
          input:
            id: 26e448c9dbe1c4a8d216a98c675079c9
        - doc: Get the spans of a trace, with --id 26e448c9dbe1c4a8d216a98c675079c9 --all
          input:
            all: true
            id: 26e448c9dbe1c4a8d216a98c675079c9
      x-osapi-method: get
