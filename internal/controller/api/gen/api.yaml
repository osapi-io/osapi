            a deploy.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            osapi did not deploy the item, so it does not change it, or the host
            does not have a program that the method needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - sysctl:read
      summary: List the kernel's parameters and which osapi manages
      tags:
        - Sysctl_API_sysctl_operations
    post:
      description: >-
        Writes osapi-net.ipv4.ip_forward.conf for net.ipv4.ip_forward to
        behaviors.sysctl.dir, /etc/sysctl.d by default, and applies it with
        sysctl -p. It fails when sysctl -p fails, because the value is not set.
        A second run with the same value changes nothing and reports changed:
        false. If the kernel has a different value, for example after a failed
        apply, it applies the value again.
      operationId: PostNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysctlCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlCreateResponse'
          description: Each target host's result, with whether it changed.
