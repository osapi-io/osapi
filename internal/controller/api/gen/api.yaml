  parameters:
    Hostname:
      description: 'Target: _all, _any, hostname, or label (group:web.dev).'
      in: path
      name: hostname
      required: true
      schema:
        minLength: 1
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,min=1,valid_target
    CertName:
      name: name
      in: path
      required: true
      description: >
        Certificate name. Must contain only alphanumeric characters,
        underscores, and hyphens.
      x-oapi-codegen-extra-tags:
        validate: required,resource_name
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9_-]+$
    DockerId:
      name: id
      in: path
      required: true
      description: >
        Container identifier (name or ID). Must start with an alphanumeric
        character and may contain letters, digits, underscores, dots, and
        hyphens.
      x-oapi-codegen-extra-tags:
        validate: required,container_id
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$
    UnitName:
      name: name
      in: path
      required: true
      description: |
        Systemd unit name (e.g., "nginx.service", "sshd.service").
      x-oapi-codegen-extra-tags:
        validate: required,unit_name
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9:_.@-]+$
    Pid:
      name: pid
      in: path
      required: true
      description: |
        Process identifier (PID).
      x-oapi-codegen-extra-tags:
        validate: required,min=1
      schema:
        type: integer
        minimum: 1
    ScheduleName:
      name: name
      in: path
      required: true
      description: >
        Scheduled entry name. Must contain only alphanumeric characters,
        underscores, and hyphens.
      x-oapi-codegen-extra-tags:
        validate: required,resource_name
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9_-]+$
    UserName:
      name: name
      in: path
      required: true
      description: >
        User account name. Must start with a lowercase letter or underscore,
        followed by lowercase letters, digits, underscores, or hyphens, with an
        optional trailing `$`; 32 characters or fewer.
      x-oapi-codegen-extra-tags:
        validate: required,account_name
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[a-z_][a-z0-9_-]*\$?$
    GroupName:
      name: name
      in: path
      required: true
      description: >
        Group name. Must start with a lowercase letter or underscore, followed
        by lowercase letters, digits, underscores, or hyphens, with an optional
        trailing `$`; 32 characters or fewer.
      x-oapi-codegen-extra-tags:
        validate: required,account_name
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[a-z_][a-z0-9_-]*\$?$
    SSHKeyFingerprint:
      name: fingerprint
      in: path
      required: true
      description: |
        SSH key SHA256 fingerprint (e.g., SHA256:abc123...).
      x-oapi-codegen-extra-tags:
        validate: required,ssh_fingerprint
      schema:
        type: string
        minLength: 1
        pattern: ^SHA256:[A-Za-z0-9+/]+=*$
    NetworkDnsInterface_name:
      description: The interface, such as eth0, or a fact such as @fact.interface.primary
      in: path
      name: interface_name
      required: true
      schema:
        pattern: ^(@fact\.[a-z0-9_.]+|[a-zA-Z0-9][a-zA-Z0-9._-]{0,14})$
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,interface_name
    NetworkInterfaceName:
      description: The interface, such as eth0, or a fact such as @fact.interface.primary
      in: path
      name: name
      required: true
      schema:
        pattern: ^(@fact\.[a-z0-9_.]+|[a-zA-Z0-9][a-zA-Z0-9._-]{0,14})$
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,interface_name
    NetworkRouteInterface_name:
      description: The interface, such as eth0, or a fact such as @fact.interface.primary
      in: path
      name: interface_name
      required: true
      schema:
        pattern: ^(@fact\.[a-z0-9_.]+|[a-zA-Z0-9][a-zA-Z0-9._-]{0,14})$
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,interface_name
    PackageName:
      description: The package to remove, such as curl
      in: path
      name: name
      required: true
      schema:
        maxLength: 255
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9.+_:~=-]*$
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,max=255,package_name
    ServiceName:
      description: The service, such as app for osapi-app.service
      in: path
      name: name
      required: true
      schema:
        pattern: ^[a-zA-Z0-9_@.-]+$
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,service_name
    SysctlKey:
      description: Parameter name, such as net.ipv4.ip_forward
      in: path
      name: key
      required: true
      schema:
        minLength: 1
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
        type: string
      x-oapi-codegen-extra-tags:
        validate: required,min=1,sysctl_key
