              type: string
          required:
            - type
          type: object
        responses:
          description: What each agent answered, by hostname.
          items:
            properties:
              changed:
                type: boolean
              data:
                description: Agent result data.
              error:
                type: string
              hostname:
                type: string
              status:
                type: string
            required:
              - hostname
            type: object
          type: array
        result:
          description: The result data if completed.
        status:
          description: Current status of the job.
          type: string
        target:
          description: >-
            The target the request gave: _any, _all, a hostname, or a label such
            as group:web.dev. A job stored before targets were kept has the host
            that answered.
          type: string
        timeline:
          description: Chronological sequence of job lifecycle events.
          items:
            properties:
              error:
                description: Error details if applicable.
                type: string
              event:
                description: >-
                  Event type (submitted, acknowledged, started, completed,
                  failed, retried).
                type: string
              hostname:
                description: Agent or source that generated the event.
                type: string
              message:
                description: Human-readable description of the event.
                type: string
              timestamp:
                description: ISO 8601 timestamp of the event.
                type: string
            type: object
          type: array
        updated_at:
          description: Last update timestamp.
          type: string
      type: object
    ListJobsResponse:
