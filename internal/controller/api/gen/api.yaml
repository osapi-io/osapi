          description: When the node was rejected or revoked.
          format: date-time
          type: string
        fingerprint:
          description: The fingerprint of the node's key.
          example: >-
            SHA256:1f53dea6dba17ae38388b931df5c6370076c8236018d6e8a2adecc8474ae93ef
          type: string
        hostname:
          description: The hostname the node gave.
          example: web-01
          type: string
        last_seen:
          description: When the node last reported.
          format: date-time
          type: string
        machine_id:
          description: The machine ID of the node.
          example: d530664edc1c431eb5ef1e9dfd6617a5
          type: string
        online:
          description: 'Whether the node is running now: it is in the registry.'
          type: boolean
        previous:
          description: >-
            On a pending record, the state of the node's earlier record: a
            returning node.
