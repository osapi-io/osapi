            Count of all jobs by status (submitted, processing, completed,
            failed, partial_failure). Derived from key names during the listing
            pass, with no extra reads.
          example: >-
            {"submitted":5,"processing":2,"completed":30,"failed":3,"partial_failure":2}
          type: object
        total_items:
          description: Total number of jobs matching the filter.
          example: 42
          type: integer
      type: object
    RetryJobRequest:
      properties:
