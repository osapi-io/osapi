  /api/node/{hostname}/sysctl:
    servers: []
    get:
      description: >-
        Lists every parameter the kernel shows under /proc/sys, with its current
        value, as sysctl -a does, and marks the ones osapi manages. A prefix,
        such as net.ipv4, limits the list to that part of the tree. The kernel
        can lack a parameter that osapi manages, for example when its module is
        not loaded. Then the list shows the value that osapi wrote.
      operationId: GetNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - description: Only this parameter and the ones under it, such as net.ipv4
          in: query
          name: prefix
          schema:
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,sysctl_key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlCollectionResponse'
          description: Each target host's result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
