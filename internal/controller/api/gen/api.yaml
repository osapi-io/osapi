info:
  title: osapi
  description: |
    Typed, repeatable operations for Linux and macOS hosts. Give your
    agent a fleet, not a shell.

    osapi lets an AI agent manage Linux and macOS hosts through typed
    operations, not through a login. Each operation is a behavior: one thing
    on a host, defined one time, with a fixed input and output. osapi checks
    each request before it queues it. A second run changes nothing. Each
    change is recorded.
  version: 1.0.0
  contact:
    url: https://github.com/osapi-io/osapi
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
