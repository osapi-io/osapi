components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A description of the error that occurred.
          example: Failed to retrieve status.
        details:
          type: string
          description: Additional details about the error.
          example: Failed due to network timeout.
        reason:
          type: string
          description: >-
            Why the request failed, as a word that a program can branch on. The
            HTTP status is the class of the problem; the reason is the cause,
            and the error is the message for a person, which can change between
            releases. invalid_request: the request breaks a rule, such as a
            missing field (400). unauthorized: no token, or a token that is not
            valid (401). forbidden: the token does not have the permission
            (403). not_found: the host or osapi does not have what the request
            names (404). not_managed: the item is there, but osapi did not
            deploy it, so osapi does not change it (409). not_installed: the
            host does not have a program that the request needs (409). conflict:
            the state of the item blocks the request, such as a create of one
            that exists (409). unavailable: a part that osapi depends on is
            down, such as NATS (503). server_error: the controller failed; its
            log has the cause (500).
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - not_managed
            - not_installed
            - conflict
            - unavailable
            - server_error
          example: not_found
    Admission:
      properties:
        admitted_at:
          description: When the node was admitted.
          format: date-time
          type: string
        decided_at:
          description: When the node was rejected or revoked.
          format: date-time
          type: string
        fingerprint:
          description: The fingerprint of the node's key.
          example: >-
