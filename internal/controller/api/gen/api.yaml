  /api/node/{hostname}/log/entry:
    servers: []
    get:
      description: >-
        Runs journalctl --output=json, the newest entries last: the last 100
        unless lines says, of one unit when unit says, since a time when since
        says, and at a priority or above when priority says. A priority is its
        name, such as err or info. The hand-written log domain read the Debian
        family only; this reads each Linux host that has journald.
      operationId: GetNodeLogEntry
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - description: Only the entries of this systemd unit, such as nginx.service
          in: query
          name: unit
          schema:
            pattern: ^[a-zA-Z0-9:_.@-]+$
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,unit_name
        - description: How many of the newest entries; 100 when it is not set
          in: query
          name: lines
          schema:
            maximum: 10000
            minimum: 1
            type: integer
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=10000
        - description: >-
            Only the entries since this time, in any form that journalctl
            --since takes, such as 1 hour ago
          in: query
          name: since
          schema:
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty
        - description: Only the entries at this priority or above
          in: query
          name: priority
          schema:
            enum:
              - emerg
              - alert
              - crit
              - err
              - warning
              - notice
              - info
              - debug
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,oneof=emerg alert crit err warning notice info debug
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntryCollectionResponse'
          description: Each target host's result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            The host does not have what the request names, such as the object of
            a deploy.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            osapi did not deploy the item, so it does not change it, or the host
            does not have a program that the method needs.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - log:read
