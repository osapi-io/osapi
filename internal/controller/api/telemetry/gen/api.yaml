---
openapi: 3.0.0
info:
  title: Telemetry API
  version: 1.0.0
tags:
  - name: telemetry
    x-displayName: Telemetry
    description: Telemetry endpoints, such as the spans of a trace.
paths:
  /api/telemetry/trace/{id}:
    get:
      operationId: GetTrace
      summary: Get the spans of a trace
      description: >-
        Returns each span of a trace, read from the tracing backend at
        telemetry.tracing.url. The backend gets the spans a few seconds after
        the request, so a trace of a request that just ran can be not found
        yet.
      tags:
        - telemetry
      security:
        - BearerAuth:
            - trace:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{32}$'
          description: The trace ID, 32 hexadecimal characters.
      responses:
        '200':
          description: The spans of the trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '400':
          description: The trace ID is not valid.
          content:
            application/json:
              schema:
                $ref: '../../components/gen/api.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - API key required.
          content:
            application/json:
              schema:
                $ref: '../../components/gen/api.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '../../components/gen/api.yaml#/components/schemas/ErrorResponse'
        '404':
          description: The backend has no trace with this ID, or not yet.
          content:
            application/json:
              schema:
                $ref: '../../components/gen/api.yaml#/components/schemas/ErrorResponse'
        '500':
          description: The tracing backend could not be read.
          content:
            application/json:
              schema:
                $ref: '../../components/gen/api.yaml#/components/schemas/ErrorResponse'
        '503':
          description: No tracing backend is configured on the controller.
          content:
            application/json:
              schema:
                $ref: '../../components/gen/api.yaml#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TraceResponse:
      type: object
      required:
        - trace_id
        - spans
      properties:
        trace_id:
          type: string
          description: The trace ID.
        spans:
          type: array
          description: Each span of the trace, ordered by start time.
          items:
            $ref: '#/components/schemas/TraceSpan'
    TraceSpan:
      type: object
      required:
        - span_id
        - name
        - service
        - start_time
        - duration_ms
        - status
        - attributes
      properties:
        span_id:
          type: string
          description: The span ID.
        parent_span_id:
          type: string
          description: The ID of the parent span. Empty for the root.
        name:
          type: string
          description: The name of the span, such as job.process.
        service:
          type: string
          description: The service that made the span, such as osapi-agent.
        kind:
          type: string
          description: The span kind, such as server, client, producer or consumer.
        start_time:
          type: string
          format: date-time
          description: When the span started.
        duration_ms:
          type: number
          format: double
          description: How long the span took, in milliseconds.
        status:
          type: string
          enum:
            - ok
            - error
          description: Whether the work of the span failed.
        status_message:
          type: string
          description: The error of a failed span.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: The attributes of the span, each as text.
