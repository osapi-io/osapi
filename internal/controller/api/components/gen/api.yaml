---
openapi: "3.0.0"
servers:
  - url: http://127.0.0.1:8080
    description: Mock API (local).
info:
  title: osapi
  description: |
    Typed, repeatable operations for Linux hosts. Give your agent a fleet, not
    a shell.

    osapi lets an AI agent manage Linux hosts through typed operations, not
    through a login. Each operation is a behavior: one thing on a host,
    defined one time, with a fixed input and output. osapi checks each
    request before it queues it. A second run changes nothing. Each change is
    recorded.
  version: 1.0.0
  contact:
    url: https://github.com/osapi-io/osapi
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
paths: {}

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A description of the error that occurred.
          example: Failed to retrieve status.
        details:
          type: string
          description: Additional details about the error.
          example: Failed due to network timeout.
        reason:
          type: string
          description: >-
            Why the request failed, as a word that a program can branch on.
            The HTTP status is the class of the problem; the reason is the
            cause, and the error is the message for a person, which can
            change between releases.
            invalid_request: the request breaks a rule, such as a missing field (400).
            unauthorized: no token, or a token that is not valid (401).
            forbidden: the token does not have the permission (403).
            not_found: the host or osapi does not have what the request names (404).
            not_managed: the item is there, but osapi did not deploy it, so osapi does not change it (409).
            not_installed: the host does not have a program that the request needs (409).
            conflict: the state of the item blocks the request, such as a create of one that exists (409).
            unavailable: a part that osapi depends on is down, such as NATS (503).
            server_error: the controller failed; its log has the cause (500).
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - not_managed
            - not_installed
            - conflict
            - unavailable
            - server_error
          example: not_found
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
