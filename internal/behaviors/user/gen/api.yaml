        - BearerAuth:
            - user:write
      summary: Add a user
      tags:
        - user_operations
      x-osapi-area: security
      x-osapi-examples:
        - doc: Add a user
          input:
            hostname: web-01
            name: osapitest
        - doc: Add a user with a shell, groups and a password
          input:
            groups:
              - root
            hostname: web-01
            name: osapitest
            password: '-'
            shell: /bin/sh
        - doc: Add a system user with its IDs and its home
          input:
            gid: 100
            home: /home/osapitest
            hostname: web-01
            name: osapitest
            system: true
            uid: 1999
      x-osapi-method: create
