        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no certificate with that name.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - certificate:read
      summary: Get one certificate authority
      tags:
        - certificate_operations
      x-osapi-examples:
        - doc: A CA that osapi deployed, by the name it was deployed with
          input:
            hostname: web-01
            name: internal-ca
        - doc: A CA of a Mac
          input:
            hostname: web-01
            name: osapi example CA
      x-osapi-method: get
    put:
      description: Writes the CA from the object, or from the one that it was deployed from when the object is empty, and rebuilds the trust store when the file changed. A CA that osapi did not deploy is not found. macOS reports skipped.
      operationId: PutNodeCertificate
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/CertificateName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateUpdateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
