        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no certificate with that name.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - certificate:write
      summary: Remove a certificate authority that osapi deployed
      tags:
        - certificate_operations
      x-osapi-examples:
        - doc: Remove a CA
          input:
            hostname: web-01
            name: internal-ca
      x-osapi-method: delete
    get:
      description: Reads one CA from the same list, by the name that list gives it. A CA that the host does not trust is not found. A name with a slash, such as a system CA of the Debian family, is in list only.
      operationId: GetNodeCertificateByKey
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/CertificateName'
      responses:
        "200":
          content:
