          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - schedule:write
      summary: Remove a cron entry that osapi deployed
      tags:
        - schedule_operations
