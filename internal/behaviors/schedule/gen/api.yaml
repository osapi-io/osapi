    put:
      description: 'Writes a new object, or the entry''s own, at the entry''s path, with the fields that the request gives and the entry''s own for the rest. A file that has the content does not change. An entry that osapi did not deploy is not found. The entry stays in its directory: an interval does not change with update.'
      operationId: PutNodeSchedule
