info:
  description: The Docker images of the host.
  title: Image API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/image:
    get:
      description: Reads each image through gohai's docker collector, which runs docker images. A host whose docker does not answer reports skipped.
      operationId: GetNodeImage
      parameters:
        - $ref: '#/components/parameters/Hostname'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The job store is at its max_bytes, and it has no finished job to remove to make room.
      security:
        - BearerAuth:
            - image:read
      summary: List the images of the host
      tags:
        - image_operations
      x-osapi-area: containers
      x-osapi-examples:
        - doc: A host with an image
          input:
            hostname: web-01
      x-osapi-method: list
  /api/node/{hostname}/image/{image}:
    delete:
      description: 'Runs docker rmi, with -f when force is set, which removes an image that a container uses. An image that the host does not have reports changed: false.'
      operationId: DeleteNodeImage
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ImageImage'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageDeleteRequest'
