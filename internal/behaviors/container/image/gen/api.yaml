info:
  description: The Docker images of the host.
  title: Image API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/container/image:
    get:
      description: Reads each image through gohai's docker collector, which runs docker images. A host whose docker does not answer reports skipped.
      operationId: GetNodeContainerImage
      parameters:
        - $ref: '#/components/parameters/Hostname'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerImageCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - container:read
      summary: List the images of the host
      tags:
        - container_image_operations
  /api/node/{hostname}/container/image/{image}:
    delete:
      description: 'Runs docker rmi, with -f when force is set, which removes an image that a container uses. An image that the host does not have reports changed: false.'
      operationId: DeleteNodeContainerImage
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ContainerImageImage'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerImageDeleteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerImageDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no image with that image.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - container:write
      summary: Remove an image
      tags:
        - container_image_operations
  /api/node/{hostname}/container/image/pull:
    post:
      description: 'Runs docker pull, and answers the ID and the size of the image that the host has after it. A pull that gets nothing new, because the host had the image of that reference already, reports changed: false.'
      operationId: PostNodeContainerImagePull
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerImagePullRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerImagePullResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - container:execute
