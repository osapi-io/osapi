info:
  description: The Docker containers of the host.
  title: Docker API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/container/docker:
    get:
      description: 'Reads each container through gohai''s docker collector, which runs docker ps and docker inspect. state limits the list to the running or the stopped ones. A host whose docker does not answer reports skipped. The environment of a container shows only the names of its variables: osapi never reads their values.'
      operationId: GetNodeContainerDocker
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - description: 'Only the containers in this state: running, stopped or all, the default'
          in: query
          name: state
          schema:
            enum:
              - running
              - stopped
              - all
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,oneof=running stopped all
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDockerCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - docker:read
      summary: List the containers of the host
      tags:
        - container_docker_operations
    post:
      description: 'Runs docker create, which pulls the image when the host does not have it. The environment goes on docker''s standard input, not in its arguments, which each user of the host can read. auto_start starts the container once it is made. A container of the name that the host has already is not made again, and reports changed: false.'
      operationId: PostNodeContainerDocker
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerDockerCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDockerCreateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - docker:write
      summary: Create a container
      tags:
        - container_docker_operations
  /api/node/{hostname}/container/docker/{name}:
    delete:
      description: 'Runs docker rm -f, which also removes a container that runs: a delete leaves no container of the name. A container that the host does not have reports changed: false.'
      operationId: DeleteNodeContainerDocker
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ContainerDockerName'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDockerDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
