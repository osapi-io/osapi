                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - docker:write
      summary: Remove a container
      tags:
        - container_docker_operations
    get:
      description: Reads one container by its name, its ID or the start of its ID. A container that the host does not have is not found.
      operationId: GetNodeContainerDockerByKey
      parameters:
        - $ref: '#/components/parameters/Hostname'
