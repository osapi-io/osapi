          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The job store is at its max_bytes, and it has no finished job to remove to make room.
      security:
        - BearerAuth:
            - ntp:write
      summary: Replace the NTP servers that osapi set
      tags:
        - ntp_operations
      x-osapi-area: config
      x-osapi-examples:
        - doc: Replace the servers
          input:
            hostname: web-01
            servers:
              - time.cloudflare.com
        - doc: The servers that the file has
          input:
            hostname: web-01
            servers:
              - 0.pool.ntp.org
      x-osapi-method: update
