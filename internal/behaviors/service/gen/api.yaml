            hostname: web-01
            name: ssh.service
        - doc: A service that osapi deployed, by the name it was deployed with
          input:
            hostname: web-01
            name: app
        - doc: A service that osapi deployed, by its unit's name
          input:
            hostname: web-01
            name: osapi-app
      x-osapi-method: get
    put:
      description: Writes the object as the unit file of a service that osapi deployed, then reloads systemd when the file changed. A service that osapi did not deploy is not found.
      operationId: PutNodeService
