      summary: Make a service that osapi deployed not start at boot
      tags:
        - service_operations
  /api/node/{hostname}/service/{name}/enable:
    post:
      description: 'Enables the service. A service that is enabled does not change, and nor does a unit with no [Install] section, which systemd calls static: it cannot start at boot. A service that osapi did not deploy is not found.'
      operationId: PostNodeServiceEnable
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ServiceName'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnableResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no service with that name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - service:write
      summary: Make a service that osapi deployed start at boot
      tags:
        - service_operations
  /api/node/{hostname}/service/{name}/restart:
    post:
      description: Restarts the service. It always changes the host. A service that osapi did not deploy is not found.
      operationId: PostNodeServiceRestart
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ServiceName'
      responses:
        "200":
          content:
            application/json:
