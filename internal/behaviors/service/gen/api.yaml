                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - service:write
      summary: Remove a service that osapi deployed
      tags:
        - service_operations
      x-osapi-area: services
      x-osapi-examples:
        - doc: Remove a service
          input:
            hostname: web-01
            name: app
        - doc: A unit file that osapi did not deploy
          input:
            hostname: web-01
            name: agent
      x-osapi-method: delete
    get:
      description: Reads one service from the same list, by its name with .service or without it. A service that osapi deployed reads by the name it was deployed with, such as app, as its writes take it, or by its unit's name, osapi-app. A service that systemd has not loaded is not found.
      operationId: GetNodeServiceByKey
