info:
  description: Run a command on target hosts.
  title: Command API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/command/exec:
    post:
      description: 'Runs the program with its arguments, each one word, with no shell between them: a ; or a | in an argument is that character. It answers with standard output and standard error apart, the exit code and the duration. A program that exits non-zero is a result, not an error. Only the admin role may run it, and the agent runs it only where agent.command.enabled is true.'
      operationId: PostNodeCommandExec
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandExecRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandExecResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - command:execute
      summary: Run a program with its arguments
      tags:
        - command_operations
      x-osapi-area: command
      x-osapi-examples:
        - doc: Print a word
          input:
            args:
              - hello
            command: echo
            hostname: web-01
        - doc: A program that exits non-zero
          input:
            command: "false"
            hostname: web-01
        - doc: In a directory, for at most 5 seconds
          input:
            command: "true"
            cwd: /tmp
            hostname: web-01
            timeout: 5
      x-osapi-method: exec
  /api/node/{hostname}/command/shell:
    post:
      description: 'Runs the command line through /bin/sh -c, so pipes, redirects and variables work. It answers as exec does. Its permission is command:shell, apart from exec''s command:execute: a token that may run a program may not open a shell. Only the admin role gets it.'
      operationId: PostNodeCommandShell
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandShellRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandShellResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - command:shell
      summary: Run a command line through /bin/sh -c
      tags:
        - command_operations
      x-osapi-area: command
      x-osapi-examples:
        - doc: A pipe
          input:
            command: echo hello | tr a-z A-Z
            hostname: web-01
        - doc: A command line that exits non-zero
          input:
            command: exit 3
            hostname: web-01
      x-osapi-method: shell
tags:
  - description: Run a command on target hosts
    name: command_operations
    x-displayName: Command
    x-osapi-area: command
    x-osapi-group: command
