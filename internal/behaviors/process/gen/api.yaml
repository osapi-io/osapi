info:
  description: The processes of the host.
  title: Process API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/process:
    get:
      description: 'Lists each process with its user, state, CPU and memory, its command line and when it started, through gohai: from /proc on Linux and from ps on macOS. A process that stops while the list is read is not in it.'
      operationId: GetNodeProcess
      parameters:
        - $ref: '#/components/parameters/Hostname'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - process:read
      summary: List the processes of the host
      tags:
        - process_operations
      x-osapi-area: node
      x-osapi-examples:
        - doc: A Linux host that runs sleep
          input:
            hostname: web-01
      x-osapi-method: list
  /api/node/{hostname}/process/{pid}:
    get:
      description: Reads one process by its ID, without the others. A process that the host does not have is not found.
      operationId: GetNodeProcessByKey
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ProcessPid'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessGetResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no process with that pid.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - process:read
      summary: Get one process
      tags:
        - process_operations
      x-osapi-area: node
      x-osapi-examples:
        - doc: A process of a Linux host
          input:
            hostname: web-01
            pid: 1234
      x-osapi-method: get
  /api/node/{hostname}/process/{pid}/signal:
    post:
      description: 'Sends TERM, KILL, HUP, INT, USR1 or USR2 to one process with kill, and reports changed: true. A process that the host does not have is not found. A process ID below 1 is refused, because kill sends to a group of processes for 0 and for a negative ID.'
      operationId: PostNodeProcessSignal
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/ProcessPid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessSignalRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessSignalResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no process with that pid.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - process:execute
      summary: Send a signal to a process
      tags:
        - process_operations
      x-osapi-area: node
      x-osapi-examples:
        - doc: Stop a process
          input:
            hostname: web-01
            pid: 1234
            signal: TERM
      x-osapi-method: signal
