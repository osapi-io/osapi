info:
  description: The DNS resolvers of each interface of the host.
  title: Dns API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/network/dns/{interface_name}:
    delete:
      description: Removes the interface's netplan file and applies what is left. An interface osapi set nothing on does not change.
      operationId: DeleteNodeNetworkDns
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkDnsInterface_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDnsDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no dns with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:write
      summary: Drop the DNS resolvers osapi set on an interface
      tags:
        - network_dns_operations
    get:
      description: 'Reads the servers and the search domains of the interface: resolvectl on Linux, with resolv.conf on a host that has no resolvers per interface, such as a container, and scutil on macOS.'
      operationId: GetNodeNetworkDnsByKey
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkDnsInterface_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDnsGetResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no dns with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:read
      summary: Get the DNS resolvers of an interface
      tags:
        - network_dns_operations
    put:
      description: Writes a netplan file of the interface's own, such as /etc/netplan/osapi-dns-eth0.yaml for eth0, under the netplan definition that matches the interface, and applies it. A definition that matches several interfaces, such as cloud-init's all for en*, gives each of them the resolvers. An empty list keeps the interface's servers or domains, and an interface with no resolvers yet starts from none. override_dhcp drops the servers DHCP gives. It runs on the Debian family, and elsewhere, and in a container, reports skipped.
      operationId: PutNodeNetworkDns
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkDnsInterface_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkDnsUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDnsUpdateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no dns with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:write
      summary: Set the DNS resolvers of an interface
      tags:
        - network_dns_operations
tags:
  - description: The DNS resolvers of each interface of the host
    name: network_dns_operations
    x-displayName: Node/Dns
