info:
  description: The routes of the host.
  title: Route API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/network/route:
    get:
      description: 'Reads each route of the main table: ip route on Linux, netstat on macOS. proto says where a route came from, such as dhcp, kernel or static.'
      operationId: GetNodeNetworkRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRouteCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:read
      summary: List the routes of the host
      tags:
        - network_route_operations
  /api/node/{hostname}/network/route/{interface_name}:
    delete:
      description: Removes the interface's routes file and applies what is left. An interface osapi has no routes of does not change.
      operationId: DeleteNodeNetworkRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkRouteInterface_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRouteDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no route with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:write
      summary: Drop the routes osapi has of an interface
      tags:
        - network_route_operations
    get:
      description: Reads the routes of the main table that go out of the interface, as list does. An interface with no routes has none; one the host does not have is not found.
      operationId: GetNodeNetworkRouteByKey
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkRouteInterface_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRouteGetResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no route with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:read
      summary: Get the routes of an interface
      tags:
        - network_route_operations
    post:
      description: 'Writes a netplan file of the interface''s routes, such as /etc/netplan/osapi-osapi0-routes.yaml for osapi0, under a netplan definition that is the interface''s own, and applies it. A default route is refused: the interface behavior sets the gateway. An interface the host does not have is not found. An interface that a match defines, such as cloud-init''s all for en*, is refused, because the routes would go on each interface the match takes, now and later. An interface osapi already has routes of does not change: update replaces them. It runs on the Debian family, and elsewhere, and in a container, reports skipped.'
      operationId: PostNodeNetworkRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkRouteInterface_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkRouteCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRouteCreateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no route with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:write
      summary: Add static routes to an interface
      tags:
        - network_route_operations
    put:
      description: 'Writes the interface''s routes file over the one osapi has, as create writes it, and applies it. An interface osapi has no routes of is not found: create adds them.'
      operationId: PutNodeNetworkRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkRouteInterface_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkRouteUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRouteUpdateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no route with that interface_name.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - network:write
      summary: Change the routes osapi has of an interface
      tags:
        - network_route_operations
tags:
  - description: The routes of the host
    name: network_route_operations
