        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - interface:write
      summary: Change the gateway or the metric of a route
      tags:
        - route_operations
      x-osapi-examples:
        - doc: A new gateway and metric
          input:
            destination: 198.51.100.0/24
            hostname: web-01
            metric: 10
            name: osapi0
            via: 192.0.2.2
      x-osapi-method: update
