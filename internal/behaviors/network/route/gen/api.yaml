info:
  description: The routes of an interface.
  title: Route API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/network/interface/{name}/route:
    delete:
      description: Drops the route from the interface's netplan file and applies what is left; the last route removes the file. A route osapi does not have does not change.
      operationId: DeleteNodeNetworkInterfaceRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkInterfaceRouteName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInterfaceRouteDeleteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterfaceRouteDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - interface:write
      summary: Drop a route that osapi wrote
      tags:
        - route_operations
      x-osapi-examples:
        - doc: One of two routes
          input:
            destination: 198.51.100.0/24
            hostname: web-01
            name: osapi0
      x-osapi-method: delete
    get:
      description: 'Reads the routes of the main table that go out of the interface: ip route on Linux, netstat on macOS. proto says where a route came from, such as dhcp, kernel or static. An interface with no routes has none; one the host does not have is not found.'
      operationId: GetNodeNetworkInterfaceRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkInterfaceRouteName'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterfaceRouteCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid, or the host refuses the input, such as a path that is a directory.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - interface:read
      summary: List the routes of an interface
      tags:
        - route_operations
      x-osapi-examples:
        - doc: An interface with routes
          input:
            hostname: web-01
            name: eth0
        - doc: An interface with no routes
          input:
            hostname: web-01
            name: eth1
        - doc: A Mac
          input:
            hostname: web-01
            name: en0
      x-osapi-method: list
    post:
      description: 'Adds the route to the interface''s netplan file, such as /etc/netplan/osapi-osapi0-routes.yaml for osapi0, under a netplan definition that is the interface''s own, and applies it. A route osapi already has, the same, does not change; one to the same destination by another gateway or metric is refused: update changes it. A default route is refused: the interface behavior sets the gateway. An interface the host does not have is not found. An interface that a match defines, such as cloud-init''s all for en*, is refused, because the route would go on each interface the match takes. It runs on the Debian family, and elsewhere, and in a container, reports skipped.'
      operationId: PostNodeNetworkInterfaceRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/NetworkInterfaceRouteName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkInterfaceRouteCreateRequest'
        required: true
