          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - interface:write
      summary: Add a static route to an interface
      tags:
        - route_operations
      x-osapi-examples:
        - doc: A route
          input:
            destination: 198.51.100.0/24
            hostname: web-01
            name: osapi0
            via: 192.0.2.1
        - doc: A second route, with a metric
          input:
            destination: 2001:db8:1::/48
            hostname: web-01
            metric: 200
            name: osapi0
            via: 2001:db8::1
      x-osapi-method: create
    put:
      description: 'Writes the route over the one osapi has to the same destination, and applies it. A destination osapi has no route to is not found: create adds it.'
      operationId: PutNodeNetworkInterfaceRoute
      parameters:
        - $ref: '#/components/parameters/Hostname'
