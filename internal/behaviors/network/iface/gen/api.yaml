            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - interface:read
      summary: List the network interfaces of the host
      tags:
        - interface_operations
      x-osapi-area: networking
      x-osapi-examples:
        - doc: A Linux host
          input:
            hostname: web-01
      x-osapi-method: list
  /api/node/{hostname}/interface/{name}:
    delete:
      description: Removes the interface's netplan file and applies what is left. netplan apply leaves the link of a dummy, so delete then deletes the link with ip link delete. An interface osapi does not configure does not change.
      operationId: DeleteNodeInterface
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/InterfaceName'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
