          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no interface with that name.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - interface:write
      summary: Configure a network interface
      tags:
        - interface_operations
      x-osapi-area: networking
      x-osapi-examples:
        - doc: A dummy interface with a static address
          input:
            addresses:
              - 10.0.1.5/24
            hostname: web-01
            name: osapi0
            type: dummy
        - doc: Each setting
          input:
            addresses:
              - 2001:db8::5/64
            dhcp6: true
            hostname: web-01
            mac_address: 52:54:00:aa:bb:cc
            mtu: 9000
            name: osapi0
            type: dummy
        - doc: An interface the host has
          input:
            dhcp4: true
            hostname: web-01
            name: eth1
            wakeonlan: true
      x-osapi-method: create
    put:
      description: 'Writes the interface''s netplan file over the one osapi has, as create writes it, and applies it. Without type dummy, the config goes in the section that netplan status gives, which is dummy-devices for a dummy, so a dummy stays a dummy. An interface osapi does not configure is not found: create configures it.'
