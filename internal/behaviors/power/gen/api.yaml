paths:
  /api/node/{hostname}/power/reboot:
    post:
      description: Runs shutdown -r -- +N, with N the delay in whole minutes and at least one, so the agent can answer before the host goes down. A message goes to the logged-in users. Each run changes the host.
      operationId: PostNodePowerReboot
