info:
  description: Kernel parameters, written to sysctl.d files and applied.
  title: Sysctl API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/node/{hostname}/sysctl:
    get:
      description: Lists every parameter the kernel shows under /proc/sys, with its current value, as sysctl -a does, and marks the ones osapi manages. A prefix, such as net.ipv4, limits the list to that part of the tree. The kernel can lack a parameter that osapi manages, for example when its module is not loaded. Then the list shows the value that osapi wrote.
      operationId: GetNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - description: Only this parameter and the ones under it, such as net.ipv4
          in: query
          name: prefix
          schema:
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
            type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,sysctl_key
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlCollectionResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - sysctl:read
      summary: List the kernel's parameters and which osapi manages
      tags:
        - sysctl_operations
    post:
      description: 'Writes osapi-net.ipv4.ip_forward.conf for net.ipv4.ip_forward to behaviors.sysctl.dir, /etc/sysctl.d by default, and applies it with sysctl -p. It fails when sysctl -p fails, because the value is not set. A second run with the same value changes nothing and reports changed: false. If the kernel has a different value, for example after a failed apply, it applies the value again.'
      operationId: PostNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysctlCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlCreateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host does not have what the request names, such as the object of a deploy.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - sysctl:write
      summary: Manage a kernel parameter and apply it
      tags:
        - sysctl_operations
  /api/node/{hostname}/sysctl/{key}:
    delete:
      description: 'Removes the file that osapi wrote for it and reloads with sysctl --system. Then a setting for the key in a different file takes effect. If there is no such setting, the parameter keeps its current value until the next reboot. A delete of a parameter that osapi does not manage reports changed: false.'
      operationId: DeleteNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/SysctlKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlDeleteResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no sysctl with that key.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - sysctl:write
      summary: Stop the management of a kernel parameter
      tags:
        - sysctl_operations
    get:
      operationId: GetNodeSysctlByKey
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/SysctlKey'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlGetResponse'
          description: Each target host's result.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no sysctl with that key.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - sysctl:read
      summary: Get a kernel parameter's current value, and whether osapi manages it
      tags:
        - sysctl_operations
    put:
      description: 'The same as create, addressed by the parameter: osapi manages the parameter from then on whether it did before or not. Setting the value it already has reports changed: false.'
      operationId: PutNodeSysctl
      parameters:
        - $ref: '#/components/parameters/Hostname'
        - $ref: '#/components/parameters/SysctlKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysctlUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysctlUpdateResponse'
          description: Each target host's result, with whether it changed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is not valid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized - API key required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The host has no sysctl with that key.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: osapi did not deploy the item, so it does not change it, or the host does not have a program that the method needs.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: An error on the controller.
      security:
        - BearerAuth:
            - sysctl:write
      summary: Set a kernel parameter, manage it, and apply it
      tags:
        - sysctl_operations
tags:
  - description: Kernel parameters, written to sysctl.d files and applied
    name: sysctl_operations
    x-displayName: Node/Sysctl
