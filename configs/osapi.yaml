---
debug: true

controller:
  client:
    url: http://0.0.0.0:8080
    security:
      # Placeholder: a client request with it fails authentication. Generate
      # a token with: osapi controller token generate --roles admin --subject <you>
      # or set it via the OSAPI_CONTROLLER_CLIENT_SECURITY_BEARER_TOKEN env var.
      bearer_token: CHANGE_ME_GENERATE_WITH_OSAPI_TOKEN_GENERATE
  # Embedded management UI served at / (API at /api/).
  ui:
    enabled: true
    # Where a person opens the UI. Health shows it beside the bind address.
    # url: https://osapi.example.com/
  # PKI enrollment and job signing (default: disabled).
  # pki:
  #   enabled: false
  #   key_dir: /etc/osapi/pki
  #   auto_admit: false
  #   rotation_grace_period: 24h
  #   delete_after: ""
  # The vaults that a secret://<vault>/<key> reference names. With no list,
  # the controller has the vault below, and it makes the key file of a nats
  # vault at start when the file is not there.
  # secrets:
  #   vaults:
  #     - name: default
  #       type: nats
  #       key_file: /etc/osapi/secrets.key
  #       # targets: [group:prod]
  api:
    # Host the API, and the UI on its listener, binds to. Empty binds every
    # interface.
    # host: 127.0.0.1
    port: 8080
    # Where a person reaches the API. Health shows it beside the bind address.
    # url: https://osapi.example.com/
    # How long to wait for agent responses before returning partial
    # results. Go duration format (default: 30s).
    job_timeout: 30s
    security:
      # Placeholder: this key is intentionally too short to pass startup
      # validation. Generate a real key with: openssl rand -hex 32
      # or set the list via the OSAPI_CONTROLLER_API_SECURITY_SIGNING_KEYS env
      # var, as id=key pairs with commas between them. The first key signs new
      # tokens, with its id as their kid; each key verifies the tokens with its
      # id. To change the key, add the new one first, and remove the old one
      # when its tokens expire.
      # A key can be a reference to a vault of controller.secrets.vaults,
      # such as secret://default/jwt-signing-key.
      signing_keys:
        - id: main
          key: CHANGE_ME_BEFORE_DEPLOYING
      cors:
        allow_origins: []
      # Custom roles with fine-grained permissions.
      # Built-in roles (admin, write, read) expand to default permissions
      # unless overridden here. Permissions use resource:verb format.
      # Available: status:read, dns:read, dns:write,
      #            job:read, job:write, health:read, audit:read,
      #            command:execute, command:shell
      # roles:
      #   ops:
      #     permissions:
      #       - status:read
      #       - health:read
      #   netadmin:
      #     permissions:
      #       - dns:read
      #       - dns:write
      #       - interface:read
      #       - interface:write
      #       - health:read
  nats:
    host: localhost
    port: 4222
    client_name: osapi-api
    namespace: osapi
    auth:
      type: none
  metrics:
    enabled: true
    host: '0.0.0.0'
    port: 9090
    # Where a person opens the metrics endpoint, shown by health.
    # url: http://osapi.example.com:9090/metrics
  notifications:
    enabled: true
    notifier: 'log'
    renotify_interval: '5m'

nats:
  server:
    host: localhost
    port: 4222
    store_dir: .nats/jetstream/
    # jetstream:
    #   # Encrypts each stream and bucket in store_dir. osapi nats key create
    #   # makes the key.
    #   key_file: /etc/osapi/nats/jetstream.key
    namespace: osapi
    auth:
      type: none
      # users:
      #   - username: osapi
      #     password: '<secret>'
      # nkeys:
      #   - '<public-nkey>'
    metrics:
      enabled: true
      host: '0.0.0.0'
      port: 9092

  stream:
    name: JOBS
    subjects: jobs.>
    max_age: 24h
    max_msgs: 10000
    storage: file
    replicas: 1
    discard: old

  kv:
    bucket: job-queue
    ttl: 1h
    max_bytes: 104857600
    storage: file
    replicas: 1

  dlq:
    max_age: 168h # 7 days
    max_msgs: 1000
    storage: file
    replicas: 1

  audit:
    stream: 'AUDIT'
    subject: 'audit'
    max_age: '720h'
    max_bytes: 52428800
    storage: 'file'
    replicas: 1

  registry:
    bucket: agent-registry
    ttl: 30s
    storage: file
    replicas: 1

  facts:
    bucket: agent-facts
    ttl: 5m
    storage: file
    replicas: 1

  state:
    bucket: agent-state
    storage: file
    replicas: 1

  objects:
    bucket: file-objects
    max_bytes: 10737418240
    storage: file
    replicas: 1

  file_state:
    bucket: file-state
    storage: file
    replicas: 1

  # The encrypted values of each nats vault, with the versions of each key.
  secrets:
    bucket: secrets
    history: 10
    storage: file
    replicas: 1

telemetry:
  tracing:
    enabled: true
    # exporter: stdout
    # otlp_endpoint: localhost:4317
    # Where a person views the traces, such as a Jaeger UI. Health shows it;
    # osapi does not run the viewer.
    # url: http://jaeger.example.com:16686/

agent:
  nats:
    host: localhost
    port: 4222
    client_name: osapi-agent
    namespace: osapi
    auth:
      type: none
  consumer:
    name: jobs-agent
    max_deliver: 5
    ack_wait: 2m
    max_ack_pending: 1000
    replay_policy: instant
    back_off:
      - 30s
      - 2m
      - 5m
      - 15m
      - 30m
    inactive_threshold: 24h
  queue_group: job-agents
  hostname: ""  # defaults to system hostname
  max_jobs: 10
  labels:
    group: web.dev.us-east  # hierarchical: --target group:web, group:web.dev, etc.
  facts:
    interval: 60s
  conditions:
    memory_pressure_threshold: 90
    high_load_multiplier: 2.0
    disk_pressure_threshold: 90
  process_conditions:
    # Process RSS threshold in bytes (0 = disabled).
    memory_pressure_bytes: 0
    # Process CPU threshold as percentage (0 = disabled).
    high_cpu_percent: 0
  metrics:
    enabled: true
    host: '0.0.0.0'
    port: 9091
  # Least-privilege mode. When enabled, write commands use sudo and
  # Linux capabilities are verified at startup. See Agent Hardening docs.
  privilege_escalation:
    enabled: false
  # Command exec, command shell and docker exec. Off by default: each one runs a command the caller supplies.
  command:
    enabled: false
  # PKI enrollment and job signing (default: disabled).
  # pki:
  #   enabled: false
  #   key_dir: /etc/osapi/pki

