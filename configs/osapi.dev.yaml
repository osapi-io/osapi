---
# Development config for running the agent inside a Docker container.
# The agent connects to NATS on the host machine and registers with
# a "docker-dev" label for targeting: --target env:docker-dev
debug: true

# Each key has a default, so this file sets only what the container needs.
# osapi config default get prints the rest.

agent:
  nats:
    host: host.docker.internal
    port: 4222
    client_name: osapi-agent-dev
    namespace: osapi
    auth:
      type: none
  consumer:
    name: jobs-agent
    max_deliver: 5
    ack_wait: 2m
    max_ack_pending: 1000
    replay_policy: instant
    back_off:
      - 30s
      - 2m
      - 5m
      - 15m
      - 30m
    inactive_threshold: 24h
  hostname: ""
  max_jobs: 10
  labels:
    env: docker-dev
  facts:
    interval: 60s
  conditions:
    memory_pressure_threshold: 90
    high_load_multiplier: 2.0
    disk_pressure_threshold: 90
  metrics:
    enabled: true
    port: 9091
  # Least-privilege mode. When enabled, write commands use sudo and
  # Linux capabilities are verified at startup. See Agent Hardening docs.
  privilege_escalation:
    enabled: false
  # Command exec, command shell and docker exec. On here, for development and tests. The default is off.
  command:
    enabled: true
  # PKI enrollment and job verification. Always on: the agent asks to join
  # at its first start, and takes jobs once the controller admits it. The
  # key directory is not the controller's, because the agent keeps the
  # controller's public key as controller.pub in it.
  # pki:
  #   key_dir: /etc/osapi/pki/agent

nats:
  stream:
    name: JOBS
  kv:
    bucket: job-queue
  registry:
    bucket: agent-registry
    ttl: 30s
    storage: file
    replicas: 1
  facts:
    bucket: agent-facts
    ttl: 5m
    storage: file
    replicas: 1
  state:
    bucket: agent-state
    storage: file
    replicas: 1
  objects:
    bucket: file-objects
  file_state:
    bucket: file-state
    storage: file
    replicas: 1
